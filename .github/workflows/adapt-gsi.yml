          #!/usr/bin/env python3
          """Apply device-profile modules and built-in tweaks to a COPY of the GSI tree, logging every change.

          apply_profile.py --profile devices/x/device.yml --tree /work/tree --stock vendor=/m/vendor ... --report DIR
                           [--builtin strip_vndk,strip_cjk_fonts] [--modules id1,id2 | --modules enabled] [--dry-run]

          Every module in the profile must carry: id, type, evidence, why, android16, test.  Reversing a change = removing the
          module from the profile and rebuilding (the original GSI is never modified).
          """
          import argparse, hashlib, json, os, re, shutil, sys
          import xml.etree.ElementTree as ET
          import yaml

          CHANGES = []
          TEXT_EXT = (".xml", ".prop", ".rc", ".conf", ".json", ".txt", ".kl", ".kcm", ".cfg", ".ini", ".cil")
          REQUIRED = ("id", "type", "evidence", "why", "android16", "test")

          class ModuleError(Exception):
              pass

          def sha(p):
              h = hashlib.sha256()
              with open(p, "rb") as f:
                  for b in iter(lambda: f.read(1 << 20), b""):
                      h.update(b)
              return h.hexdigest()

          def log(module, action, target, before=None, after=None, detail=""):
              CHANGES.append({"module": module, "action": action, "target": target, "sha256_before": before, "sha256_after": after, "detail": detail})

          def safe_rel(p):
              if not p or p.startswith("/") or ".." in p.split("/") or re.search(r"[*?\[\]]", p):
                  raise ModuleError("unsafe path (must be exact, relative, no globs): %r" % p)
              return p

          def m_props(mod, tree, stock, dry):
              f = os.path.join(tree, safe_rel(mod["file"]))
              if not os.path.isfile(f):
                  raise ModuleError("%s: file not found: %s" % (mod["id"], mod["file"]))
              before = sha(f)
              lines = open(f, errors="replace").read().split("\n")
              for k, v in mod["set"].items():
                  if not re.fullmatch(r"[A-Za-z0-9_.\-]+", k):
                      raise ModuleError("bad property name %r" % k)
                  idx = [i for i, l in enumerate(lines) if l.startswith(k + "=")]
                  if idx:
                      log(mod["id"], "prop-replace", mod["file"], detail="%s: %s -> %s" % (k, lines[idx[-1]].split("=", 1)[1], v))
                      lines[idx[-1]] = "%s=%s" % (k, v)
                  else:
                      log(mod["id"], "prop-add", mod["file"], detail="%s=%s" % (k, v))
                      while lines and lines[-1] == "":
                          lines.pop()
                      lines.append("%s=%s" % (k, v))
              if not dry:
                  open(f, "w").write("\n".join(lines).rstrip("\n") + "\n")
                  CHANGES[-1]["sha256_after"] = sha(f)
              CHANGES[-1]["sha256_before"] = before

          def m_remove(mod, tree, stock, dry):
              for p in mod["paths"]:
                  t = os.path.join(tree, safe_rel(p))
                  if not os.path.lexists(t):
                      raise ModuleError("%s: path not found: %s" % (mod["id"], p))
                  log(mod["id"], "remove", p, detail="dir" if os.path.isdir(t) and not os.path.islink(t) else "file")
                  if not dry:
                      shutil.rmtree(t) if os.path.isdir(t) and not os.path.islink(t) else os.remove(t)

          def m_copy(mod, tree, stock, dry):
              if mod["from"] not in stock:
                  raise ModuleError("%s: unknown stock partition %r" % (mod["id"], mod["from"]))
              src = os.path.join(stock[mod["from"]], safe_rel(mod["src"]))
              dst = os.path.join(tree, safe_rel(mod["dst"]))
              like = os.path.join(tree, safe_rel(mod["like"])) if mod.get("like") else None
              if not os.path.isfile(src):
                  raise ModuleError("%s: stock file not found: %s:%s" % (mod["id"], mod["from"], mod["src"]))
              if not mod.get("allow_binary") and not src.lower().endswith(TEXT_EXT):
                  raise ModuleError("%s: refusing non-config file %s (set allow_binary: true only with an Android 16 compatibility argument)" % (mod["id"], mod["src"]))
              if not like or not os.path.exists(like):
                  raise ModuleError("%s: 'like' must name an existing GSI file to clone owner/mode/SELinux label from" % mod["id"])
              log(mod["id"], "copy", mod["dst"], before=sha(dst) if os.path.isfile(dst) else None, after=sha(src),
                  detail="from %s:%s, labels cloned from %s" % (mod["from"], mod["src"], mod["like"]))
              if dry:
                  return
              os.makedirs(os.path.dirname(dst), exist_ok=True)
              shutil.copyfile(src, dst)
              st = os.stat(like, follow_symlinks=False)
              os.chown(dst, st.st_uid, st.st_gid)
              os.chmod(dst, st.st_mode & 0o7777)
              for x in os.listxattr(like, follow_symlinks=False):
                  os.setxattr(dst, x, os.getxattr(like, x, follow_symlinks=False), follow_symlinks=False)

          def b_strip_vndk(prof, tree, dry):
              vndk = int(prof["stock"]["vndk"])
              pat = re.compile(r"^com\.android\.vndk\.v(\d+)\.(apex|capex)$")
              found = []
              for d, _, files in os.walk(tree):
                  if os.path.basename(d) != "apex":
                      continue
                  for n in files:
                      m = pat.match(n)
                      if m:
                          found.append((int(m.group(1)), os.path.join(d, n)))
              if not any(v == vndk for v, _ in found):
                  raise ModuleError("strip_vndk refused: this GSI has no com.android.vndk.v%d apex; the stock vendor (VNDK %d) would not boot. Found: %s"
                                    % (vndk, vndk, sorted(v for v, _ in found)))
              freed = 0
              for v, p in sorted(found):
                  if v < vndk:
                      freed += os.path.getsize(p)
                      log("builtin:strip_vndk", "remove", os.path.relpath(p, tree), detail="VNDK v%d < vendor v%d" % (v, vndk))
                      if not dry:
                          os.remove(p)
              log("builtin:strip_vndk", "summary", "-", detail="kept v%d and newer; freed %d MiB" % (vndk, freed >> 20))

          def b_strip_cjk(prof, tree, dry):
              sysdir = os.path.join(tree, "system") if os.path.isdir(os.path.join(tree, "system", "fonts")) else tree
              fonts, etc = os.path.join(sysdir, "fonts"), os.path.join(sysdir, "etc")
              if not os.path.isdir(fonts):
                  raise ModuleError("strip_cjk_fonts: no fonts directory at %s" % fonts)
              gone = {n for n in os.listdir(fonts) if "cjk" in n.lower()}
              bengali = [n for n in os.listdir(fonts) if "bengali" in n.lower()]
              if not bengali:
                  raise ModuleError("strip_cjk_fonts refused: no Bengali font found in the GSI; nothing to protect, check the font setup first")
              for n in sorted(gone):
                  log("builtin:strip_cjk_fonts", "remove", os.path.relpath(os.path.join(fonts, n), tree), detail="%d KiB" % (os.path.getsize(os.path.join(fonts, n)) >> 10))
                  if not dry:
                      os.remove(os.path.join(fonts, n))
              for n in sorted(os.listdir(etc)):
                  if "font" not in n.lower() or not n.endswith(".xml"):
                      continue
                  p = os.path.join(etc, n)
                  tr = ET.parse(p)
                  changed = False
                  for fam in list(tr.getroot().iter("family")):
                      for f in list(fam.findall("font")):
                          if (f.text or "").strip() in gone:
                              fam.remove(f); changed = True
                      if changed and not fam.findall("font"):
                          tr.getroot().remove(fam)
                  if changed:
                      log("builtin:strip_cjk_fonts", "xml-edit", os.path.relpath(p, tree), before=sha(p))
                      if not dry:
                          tr.write(p, encoding="utf-8", xml_declaration=True)
                          CHANGES[-1]["sha256_after"] = sha(p)

          MODS = {"props": m_props, "remove_paths": m_remove, "copy_from_stock": m_copy}
          BUILT = {"strip_vndk": b_strip_vndk, "strip_cjk_fonts": b_strip_cjk}

          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument("--profile", required=True)
              ap.add_argument("--tree", required=True)
              ap.add_argument("--stock", nargs="*", default=[])
              ap.add_argument("--report", required=True)
              ap.add_argument("--builtin", default="")
              ap.add_argument("--modules", default="enabled")
              ap.add_argument("--dry-run", action="store_true")
              a = ap.parse_args()
              prof = yaml.safe_load(open(a.profile))
              stock = dict(x.split("=", 1) for x in a.stock)
              mods = prof.get("modules") or []
              chosen = [m for m in mods if (m.get("enabled") if a.modules == "enabled" else m.get("id") in a.modules.split(","))]
              rc = 0
              try:
                  for m in chosen:
                      miss = [k for k in REQUIRED if not m.get(k)]
                      if miss:
                          raise ModuleError("module %r is missing required fields: %s" % (m.get("id"), ", ".join(miss)))
                      if m["type"] not in MODS:
                          raise ModuleError("module %s: unknown type %s" % (m["id"], m["type"]))
                      MODS[m["type"]](m, a.tree, stock, a.dry_run)
                  for b in [x for x in a.builtin.split(",") if x]:
                      if b not in BUILT:
                          raise ModuleError("unknown builtin %s" % b)
                      BUILT[b](prof, a.tree, a.dry_run)
              except ModuleError as e:
                  print("::error::" + str(e))
                  log("error", "failed", "-", detail=str(e))
                  rc = 1
              os.makedirs(a.report, exist_ok=True)
              json.dump(CHANGES, open(os.path.join(a.report, "changes.json"), "w"), indent=1)
              md = ["# Change record%s" % (" (dry run, nothing was modified)" if a.dry_run else ""), "",
                    "Modules selected: %s; built-ins: %s" % (", ".join(m["id"] for m in chosen) or "none", a.builtin or "none"), "",
                    "| module | action | target | detail |", "|---|---|---|---|"]
              md += ["| %s | %s | `%s` | %s |" % (c["module"], c["action"], c["target"], c["detail"].replace("|", "/")[:200]) for c in CHANGES]
              if not CHANGES:
                  md.append("| _no changes_ | | | |")
              for m in chosen:
                  md += ["", "### %s" % m.get("id"), "- evidence: %s" % m.get("evidence", "MISSING"), "- why: %s" % m.get("why", "MISSING"),
                         "- Android 16: %s" % m.get("android16", "MISSING"), "- test: %s" % m.get("test", "MISSING")]
              open(os.path.join(a.report, "CHANGES.md"), "w").write("\n".join(md) + "\n")
              print("apply_profile: %d change records, rc=%d%s" % (len(CHANGES), rc, " (dry run)" if a.dry_run else ""))
              sys.exit(rc)

          if __name__ == "__main__":
              main()
          EOF_TOOL
          chmod +x "$TOOLS"/*.py
          for f in "$TOOLS"/*.py; do python3 -m py_compile "$f"; done

      - name: Load device profile
        run: |
          [[ "$DEVICE" =~ ^[a-z0-9_-]+$ ]] || { echo "::error::invalid device name"; exit 1; }
          P="devices/$DEVICE/device.yml"
          [ -f "$P" ] || { echo "::error::missing $P (copy devices/rmx3834/ and edit it)"; exit 1; }
          g() { python3 "$TOOLS/profile.py" "$P" "$1"; }
          RT="$(g stock.release_tag)"; [ -n "$RT" ] || { echo "::error::stock.release_tag missing in $P"; exit 1; }
          {
            echo "PROFILE=$P"
            echo "RELEASE_TAG=$RT"
            echo "MODEL_NUM=$(g device.model_number)"
            echo "VNDK=$(g stock.vndk)"
            echo "TARGET_LEVEL=$(g stock.vintf_target_level)"
            echo "EXPECT_FP=$(g stock.fingerprint)"
            echo "ASSETS=$(g stock.assets | tr '\n' ' ')"
            echo "EROFS_ARGS=$(g kernel.erofs.mkfs_args | tr '\n' ' ')"
            echo "PROFILE_MAX_MB=$(g size_limit_mb)"
          } >> "$GITHUB_ENV"
          cat "$P"

      - name: Mount stock reference images (read-only)
        run: |
          source "$TOOLS/lib.sh"
          mkdir -p "$WORK/stock/img"
          : > "$REPORT/assets.txt"
          for a in $ASSETS; do
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" -p "$a.img" -D "$WORK/stock/img" --clobber
            [ -f "$WORK/stock/img/$a.img" ] || { echo "::error::release $RELEASE_TAG has no $a.img"; exit 1; }
            echo "$a.img  $(stat -c %s "$WORK/stock/img/$a.img") bytes  sha256 $(sha256sum "$WORK/stock/img/$a.img" | cut -d' ' -f1)" >> "$REPORT/assets.txt"
            unsparse "$WORK/stock/img/$a.img" "$WORK/stock/img/$a.raw"
            note "stock $a: $(fstype "$WORK/stock/img/$a.raw")"
            mount_ro "$WORK/stock/img/$a.raw" "$WORK/stock/$a"
          done
          df -h /

      - name: Download, unpack and mount the GSI (read-only)
        env:
          GSI_URL: ${{ inputs.gsi_url }}
        run: |
          source "$TOOLS/lib.sh"
          mkdir -p "$WORK/dl/x"
          cd "$WORK/dl"
          aria2c -x8 -s8 -k1M --allow-overwrite=true -o input "$GSI_URL"
          echo "gsi input sha256 $(sha256sum input | cut -d' ' -f1)" >> "$REPORT/assets.txt"
          case "$(file -b input)" in
            Zip*)   unzip -oq input -d x; rm -f input ;;
            XZ*)    xz -dc input > x/system.img; rm -f input ;;
            gzip*)  gzip -dc input > x/system.img; rm -f input ;;
            7-zip*) 7z x -y -ox input >/dev/null; rm -f input ;;
            *)      mv input x/system.img ;;
          esac
          find x -type f \( -name '*.xz' -o -name '*.gz' \) -print0 | while IFS= read -r -d '' f; do
            case "$f" in *.xz) xz -df "$f" ;; *.gz) gzip -df "$f" ;; esac
          done
          IMG="$(find x -type f -iname '*.img' -printf '%s %p\n' | sort -rn | head -1 | cut -d' ' -f2-)"
          [ -n "$IMG" ] || { echo "::error::no .img inside the download"; exit 1; }
          echo "using $IMG"
          unsparse "$IMG" "$WORK/dl/gsi.raw"
          rm -rf x
          note "gsi filesystem: $(fstype "$WORK/dl/gsi.raw")"
          mount_ro "$WORK/dl/gsi.raw" "$WORK/gsi_mnt"
          ls "$WORK/gsi_mnt" | head -30
          df -h /

      - name: Provenance and consistency
        id: provenance
        continue-on-error: true
        run: |
          source "$TOOLS/lib.sh"
          V="$WORK/stock/vendor"
          {
            echo "# Provenance and consistency"; echo
            echo "## Image hashes"; echo '```'; cat "$REPORT/assets.txt"; echo '```'; echo
            echo "## VNDK properties found in ANY vendor .prop (raw)"; echo '```'
            grep -rn --include='*.prop' -i 'vndk' "$V" || echo "NONE FOUND in any vendor .prop file"
            echo '```'; echo
            echo "Profile says VNDK = $VNDK (from the live phone). If the list above is empty, either the released vendor.img differs from the running vendor, or the property is set elsewhere (init, bootconfig). Resolve this with capture.sh on the phone (provenance.txt) before trusting any VNDK-based change."; echo
            echo "## Vendor fingerprints vs the profile"; echo '```'
            m=0
            for f in "$V"/*.prop; do
              fp="$(grep -h '^ro.vendor.build.fingerprint=' "$f" 2>/dev/null | head -1 | cut -d= -f2- || true)"
              [ -n "$fp" ] || continue
              if [ "$fp" = "$EXPECT_FP" ]; then echo "MATCH   $(basename "$f")"; m=$((m+1)); else echo "differs $(basename "$f")  $fp"; fi
            done
            echo '```'; echo
            echo "Variants whose fingerprint equals the profile: $m. The phone loads exactly one prop variant; identify it with capture.sh (variant.txt)."
          } > "$REPORT/provenance.md"
          note "provenance: see provenance.md"

      - name: Property inventory
        id: props
        continue-on-error: true
        run: |
          for a in $ASSETS; do python3 "$TOOLS/props_report.py" --label "$a" --root "$WORK/stock/$a" --out "$REPORT" --model "$MODEL_NUM" | tee -a "$REPORT/summary.txt"; done
          python3 "$TOOLS/props_report.py" --label gsi --root "$WORK/gsi_mnt" --out "$REPORT" | tee -a "$REPORT/summary.txt"

      - name: VINTF compatibility
        id: vintf
        continue-on-error: true
        run: |
          ROOTS="vendor=$WORK/stock/vendor"
          [ -d "$WORK/stock/odm" ] && ROOTS="$ROOTS odm=$WORK/stock/odm"
          python3 "$TOOLS/vintf_check.py" --device-roots $ROOTS --gsi-root "$WORK/gsi_mnt" --out "$REPORT" --target-level "$TARGET_LEVEL" | tee -a "$REPORT/summary.txt"

      - name: Init services
        id: rc
        continue-on-error: true
        run: |
          R=""
          for a in $ASSETS; do R="$R $a=$WORK/stock/$a"; done
          python3 "$TOOLS/rc_report.py" --roots $R gsi="$WORK/gsi_mnt" --out "$REPORT" | tee -a "$REPORT/summary.txt"

      - name: Overlay audit
        id: overlays
        continue-on-error: true
        run: |
          R=""
          for a in $ASSETS; do R="$R $a=$WORK/stock/$a"; done
          python3 "$TOOLS/overlay_audit.py" --target-apk "$WORK/gsi_mnt/system/framework/framework-res.apk" --scan $R gsi="$WORK/gsi_mnt" --out "$REPORT" | tee -a "$REPORT/summary.txt"

      - name: SELinux facts
        id: selinux
        continue-on-error: true
        run: python3 "$TOOLS/selinux_check.py" --vendor "$WORK/stock/vendor" --gsi "$WORK/gsi_mnt" --out "$REPORT" | tee -a "$REPORT/summary.txt"

      - name: Device configs and listings
        id: configs
        continue-on-error: true
        run: |
          R=""
          for a in $ASSETS; do R="$R $a=$WORK/stock/$a"; done
          python3 "$TOOLS/configs_report.py" --roots $R gsi="$WORK/gsi_mnt" --out "$REPORT" | tee -a "$REPORT/summary.txt"

      - name: VNDK dependency check
        id: vndk
        continue-on-error: true
        run: |
          {
            echo "# VNDK apexes in the GSI (vendor needs v$VNDK)"; echo '```'
            find "$WORK/gsi_mnt/" -path '*/apex/com.android.vndk.*' -printf '%P  %s bytes\n' | sort
            echo '```'
          } > "$REPORT/vndk.md"
          cat "$REPORT/vndk.md"
          find "$WORK/gsi_mnt/" -path "*/apex/com.android.vndk.v${VNDK}.*" | grep -q . || { echo "::warning::GSI has no VNDK v$VNDK apex"; exit 1; }

      - name: Validate profile modules (dry run)
        id: profilecheck
        continue-on-error: true
        run: |
          S=""
          for a in $ASSETS; do S="$S $a=$WORK/stock/$a"; done
          python3 "$TOOLS/apply_profile.py" --profile "$PROFILE" --tree "$WORK/gsi_mnt" --stock $S --report "$REPORT/dryrun" --modules enabled --dry-run | tee -a "$REPORT/summary.txt"

      # ------------------------------------------------------------------ build
      - name: Copy GSI tree (all xattrs kept)
        if: ${{ inputs.mode != 'audit' }}
        run: |
          sudo mkdir -p "$WORK/tree"
          sudo rsync -aHAX --numeric-ids --exclude=/lost+found "$WORK/gsi_mnt"/ "$WORK/tree"/
          df -h /

      - name: Apply profile modules and toggles
        if: ${{ inputs.mode == 'adapted' }}
        env:
          STRIP_VNDK: ${{ inputs.strip_old_vndk }}
          STRIP_CJK: ${{ inputs.strip_cjk_fonts }}
          PROFILE_MODULES: ${{ inputs.profile_modules }}
        run: |
          B=""
          [ "$STRIP_VNDK" = "true" ] && B="strip_vndk"
          [ "$STRIP_CJK" = "true" ] && B="${B:+$B,}strip_cjk_fonts"
          S=""
          for a in $ASSETS; do S="$S $a=$WORK/stock/$a"; done
          sudo python3 "$TOOLS/apply_profile.py" --profile "$PROFILE" --tree "$WORK/tree" --stock $S --report "$REPORT" --builtin "$B" --modules "$PROFILE_MODULES"

      - name: Build image
        if: ${{ inputs.mode != 'audit' }}
        env:
          OUT_FS: ${{ inputs.out_fs }}
        run: |
          OUT="$WORK/out/system.img"
          if [ "$OUT_FS" = "erofs" ]; then
            echo "mkfs.erofs $EROFS_ARGS"
            sudo mkfs.erofs $EROFS_ARGS "$OUT" "$WORK/tree"
          else
            SIZE=$(( $(sudo du -sm "$WORK/tree" | cut -f1) * 106 / 100 + 96 ))
            truncate -s "${SIZE}M" "$OUT"
            sudo mke2fs -q -t ext4 -b 4096 -L system -m 0 -O ^has_journal -d "$WORK/tree" "$OUT"
            sudo e2fsck -fy "$OUT" || true
            sudo resize2fs -M "$OUT"
          fi
          ls -l "$OUT"

      - name: Verify image
        if: ${{ inputs.mode != 'audit' }}
        env:
          MAXMB: ${{ inputs.max_size_mb }}
        run: |
          source "$TOOLS/lib.sh"
          OUT="$WORK/out/system.img"
          BYTES=$(stat -c %s "$OUT")
          LIMIT="$MAXMB"; [ "$LIMIT" = "0" ] && LIMIT="$PROFILE_MAX_MB"
          if [ -n "$LIMIT" ] && [ "$LIMIT" != "0" ] && [ "$BYTES" -gt $(( LIMIT * 1024 * 1024 )) ]; then
            echo "::error::system.img is $((BYTES/1024/1024)) MiB, limit $LIMIT MiB"; exit 1
          fi
          command -v fsck.erofs >/dev/null && [ "$(fstype "$OUT")" = erofs ] && fsck.erofs "$OUT"
          mount_ro "$OUT" "$WORK/mnt_out"
          test -f "$WORK/mnt_out/system/build.prop" || test -f "$WORK/mnt_out/build.prop"
          test -d "$WORK/mnt_out/system" && ls "$WORK/mnt_out" | head -20
          dump() { (cd "$1" && sudo getfattr -R -h -d -m '^security\.' . 2>/dev/null | LC_ALL=C sort); }
          dump "$WORK/tree" > "$WORK/xa.txt"
          dump "$WORK/mnt_out" > "$WORK/xb.txt"
          if ! diff -q "$WORK/xa.txt" "$WORK/xb.txt" >/dev/null; then
            diff "$WORK/xa.txt" "$WORK/xb.txt" | head -40
            echo "::error::security xattrs (SELinux labels/capabilities) differ between the tree and the built image"; exit 1
          fi
          echo "security xattrs identical ($(wc -l < "$WORK/xa.txt") lines)"
          sudo umount "$WORK/mnt_out"
          sha256sum "$OUT" | tee "$WORK/out/system.img.sha256"
          {
            echo "device:   $DEVICE ($MODE)"
            echo "gsi:      $(grep 'gsi input' "$REPORT/assets.txt")"
            echo "profile:  $PROFILE"
            echo "erofs:    $EROFS_ARGS"
            echo "size:     $((BYTES/1024/1024)) MiB"
            echo "built:    $(date -u '+%Y-%m-%d %H:%M UTC') from $GITHUB_REPOSITORY@$GITHUB_SHA"
          } | tee "$WORK/out/BUILD-INFO.txt"
          cat > "$WORK/out/HOW-TO-TEST.txt" <<'TXT'
          Test through DSU Sideloader first. The stock system, product and vendor are not touched by DSU.
          Test the BASELINE image before any adapted image, so a failure can be blamed on a specific change.
          After booting, run capture.sh (phone folder of this project) and compare with the stock capture.
          TXT

      # --------------------------------------------------------------- wrap up
      - name: Summary
        if: always()
        env:
          S_PROV: ${{ steps.provenance.outcome }}
          S_PROPS: ${{ steps.props.outcome }}
          S_VINTF: ${{ steps.vintf.outcome }}
          S_RC: ${{ steps.rc.outcome }}
          S_OVERLAYS: ${{ steps.overlays.outcome }}
          S_SELINUX: ${{ steps.selinux.outcome }}
          S_CONFIGS: ${{ steps.configs.outcome }}
          S_VNDK: ${{ steps.vndk.outcome }}
          S_PROFILE: ${{ steps.profilecheck.outcome }}
        run: |
          {
            echo "## Adapt GSI: $DEVICE, mode $MODE"
            echo
            echo "| stage | outcome |"; echo "|---|---|"
            echo "| provenance | $S_PROV |"; echo "| properties | $S_PROPS |"; echo "| VINTF | $S_VINTF |"; echo "| init services | $S_RC |"
            echo "| overlays | $S_OVERLAYS |"; echo "| SELinux | $S_SELINUX |"; echo "| configs | $S_CONFIGS |"; echo "| VNDK dependency | $S_VNDK |"; echo "| profile modules (dry run) | $S_PROFILE |"
            echo
            echo '```'; cat "$REPORT/summary.txt" 2>/dev/null; echo '```'
            if [ -f "$REPORT/vintf.md" ]; then echo; sed -n '/## Check A/,/### Focus/p' "$REPORT/vintf.md" | head -60; fi
            echo
            echo "Full reports are in the **report-$DEVICE** artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Unmount
        if: always()
        run: |
          for m in "$WORK"/mnt_out "$WORK"/gsi_mnt "$WORK"/stock/*/; do sudo umount "$m" 2>/dev/null || true; done
          sudo losetup -D || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ inputs.device }}
          path: /work/report
          if-no-files-found: warn
          retention-days: 14

      - name: Upload image
        if: ${{ inputs.mode != 'audit' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: system-${{ inputs.device }}-${{ inputs.mode }}
          path: |
            /work/out/system.img
            /work/out/system.img.sha256
            /work/out/BUILD-INFO.txt
            /work/out/HOW-TO-TEST.txt
          compression-level: 0
          retention-days: 7
