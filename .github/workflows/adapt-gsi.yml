
name: Adapt GSI to a device

# Device-profile driven GSI adaptation.
#   mode = audit    : read-only reports (VINTF, props, init, overlays, SELinux, configs). Nothing is built.
#   mode = baseline : audit + plain filesystem conversion of the untouched GSI (the control build; test this first under DSU).
#   mode = adapted  : audit + profile modules + the VNDK/font toggles, every change recorded in CHANGES.md.
# The stock images and the GSI are only ever mounted read-only. Output goes to a separate image.

on:
  workflow_dispatch:
    inputs:
      gsi_url:
        description: "Direct link to the GSI (.img, .img.xz, .zip, .7z, .gz)"
        required: true
        type: string
      device:
        description: "Folder under devices/ that holds device.yml"
        type: string
        default: rmx3834
      mode:
        description: "audit = reports only | baseline = reports + plain repack | adapted = reports + profile modules"
        type: choice
        options: [audit, baseline, adapted]
        default: audit
      out_fs:
        description: "Output filesystem (erofs flags come from the device profile)"
        type: choice
        options: [erofs, ext4]
        default: erofs
      strip_old_vndk:
        description: "adapted only: remove VNDK apexes older than the vendor's (refuses if the vendor's version is missing)"
        type: boolean
        default: false
      strip_cjk_fonts:
        description: "adapted only: remove CJK fonts and their fonts.xml entries (refuses if no Bengali font)"
        type: boolean
        default: false
      profile_modules:
        description: "adapted only: 'enabled' (modules with enabled: true), 'none', or comma-separated module ids"
        type: string
        default: enabled
      max_size_mb:
        description: "Refuse images bigger than this (0 = use size_limit_mb from the profile)"
        type: string
        default: "0"

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  WORK: /work
  TOOLS: /work/tools
  REPORT: /work/report

jobs:
  adapt:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      DEVICE: ${{ inputs.device }}
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk and install tools
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 erofs-utils e2fsprogs rsync attr xz-utils p7zip-full unzip file python3 python3-yaml xxd
          sudo apt-get install -y -qq aapt || echo "::warning::aapt is not installable here: the overlay audit will be skipped"
          sudo mkdir -p "$WORK"/{dl,stock,out,report,tools}
          sudo chown -R "$USER" "$WORK"
          mkfs.erofs --version || true
          df -h /

      - name: Write analysis tools
        run: |
          cat > "$TOOLS/lib.sh" <<'EOF_TOOL'
          # Shared shell helpers. Source with: source "$TOOLS/lib.sh"
          unsparse() { # in out  (sparse -> raw; raw -> moved)
            if [ "$(head -c4 "$1" | xxd -p)" = "3aff26ed" ]; then
              python3 "$TOOLS/unsparse.py" "$1" "$2" && rm -f "$1"
            else
              mv -f "$1" "$2"
            fi
          }
          fstype() {
            if [ "$(dd if="$1" bs=1 skip=1024 count=4 2>/dev/null | xxd -p)" = "e2e1f5e0" ]; then echo erofs
            elif [ "$(dd if="$1" bs=1 skip=1080 count=2 2>/dev/null | xxd -p)" = "53ef" ]; then echo ext4
            else echo unknown; fi
          }
          mount_ro() { # img dir
            local t; t="$(fstype "$1")"
            sudo mkdir -p "$2"
            case "$t" in
              erofs) sudo mount -t erofs -o ro,loop "$1" "$2" ;;
              ext4)  sudo mount -t ext4 -o ro,loop,noload "$1" "$2" ;;
              *) echo "::error::unknown filesystem in $1"; return 1 ;;
            esac
          }
          note() { echo "$*" | tee -a "$REPORT/summary.txt"; }
          EOF_TOOL
          cat > "$TOOLS/profile.py" <<'EOF_TOOL'
          #!/usr/bin/env python3
          """profile.py <device.yml> <dotted.key>  -> prints the value (lists: one item per line)."""
          import sys
          import yaml

          def get(d, path):
              for k in path.split("."):
                  if isinstance(d, dict):
                      d = d.get(k)
                  else:
                      return None
              return d

          if __name__ == "__main__":
              with open(sys.argv[1]) as f:
                  d = yaml.safe_load(f)
              v = get(d, sys.argv[2])
              if v is None:
                  sys.exit(0)
              if isinstance(v, list):
                  print("\n".join(str(x) for x in v))
              elif isinstance(v, bool):
                  print("true" if v else "false")
              else:
                  print(v)
          EOF_TOOL
          cat > "$TOOLS/unsparse.py" <<'EOF_TOOL'
          #!/usr/bin/env python3
          """unsparse.py <in> <out> : convert an Android sparse image to a raw image."""
          import struct, sys
          src, dst = sys.argv[1], sys.argv[2]
          with open(src, "rb") as f, open(dst, "wb") as o:
              magic, major, minor, fhs, chs, blk, tblks, tchunks, crc = struct.unpack("<IHHHHIIII", f.read(28))
              assert magic == 0xED26FF3A, "not a sparse image"
              f.seek(fhs)
              for _ in range(tchunks):
                  ctype, _r, csz, tsz = struct.unpack("<HHII", f.read(12))
                  n = csz * blk
                  if ctype == 0xCAC1:
                      left = n
                      while left:
                          b = f.read(min(left, 1 << 24))
                          if not b:
                              raise SystemExit("truncated sparse image")
                          o.write(b)
                          left -= len(b)
                  elif ctype == 0xCAC2:
                      pat = f.read(4) * (blk // 4)
                      for _ in range(csz):
                          o.write(pat)
                  elif ctype == 0xCAC3:
                      o.seek(n, 1)
                  elif ctype == 0xCAC4:
                      f.read(4)
                  else:
                      raise SystemExit("unknown chunk type %x" % ctype)
              o.truncate(tblks * blk)
          EOF_TOOL
          cat > "$TOOLS/props_report.py" <<'EOF_TOOL'
          #!/usr/bin/env python3
          """Property inventory for one mounted tree.

          props_report.py --label vendor --root /work/stock/vendor --out /work/report [--model 3834]
          Writes props-<label>.md and props-<label>.json. Never treats a missing property as fatal.
          """
          import argparse, json, os, re, sys
          from collections import defaultdict

          KEY_RES = [re.compile(p) for p in (
              r"^ro\.(vendor\.|system\.|product\.|odm\.|system_ext\.|bootimage\.)?build\.(fingerprint|id|display\.id|"
              r"version\.(release|sdk|incremental|release_or_codename|security_patch))$",
              r"^ro\.(product\.|board\.|vendor\.)?first_api_level$",
              r"^ro\.(product\.|vendor\.)?vndk\.version$",
              r"^ro\.(hardware|board\.platform|boot\.hardware)",
              r"^ro\.product\.(vendor\.|system\.|odm\.)?(model|name|device|brand|manufacturer)$",
          )]
          TOPIC_RE = re.compile(r"bluetooth|\bbt\b|brightness|backlight|sensor|light|\.ims|volte|vowifi|radio|refresh|"
                                r"display|\.sf\.|audio|telephony|vndk|a2dp|thermal|charg|\.wcn|\.wifi", re.I)
          VARIANT_RE = re.compile(r"^build_(?P<sku>[A-Za-z0-9]+)_(?P<model>\d+)\.prop$")

          def parse_prop(path):
              props, imports = {}, []
              try:
                  if os.path.getsize(path) > 4 * 1024 * 1024:
                      return props, ["<skipped: file larger than 4MB>"]
                  with open(path, "r", errors="replace") as f:
                      for line in f:
                          line = line.strip()
                          if not line or line.startswith("#"):
                              continue
                          if line.startswith("import "):
                              imports.append(line[7:].strip())
                              continue
                          if "=" in line:
                              k, v = line.split("=", 1)
                              props[k.strip()] = v.strip()
              except OSError as e:
                  imports.append("<unreadable: %s>" % e)
              return props, imports

          def find_prop_files(root):
              out = []
              for d, dirs, files in os.walk(root, followlinks=False):
                  for n in files:
                      if n.endswith(".prop") or n in ("build.prop", "default.prop"):
                          p = os.path.join(d, n)
                          if os.path.isfile(p) and not os.path.islink(p):
                              out.append(p)
              return sorted(out)

          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument("--label", required=True)
              ap.add_argument("--root", required=True)
              ap.add_argument("--out", required=True)
              ap.add_argument("--model", default="")
              a = ap.parse_args()
              os.makedirs(a.out, exist_ok=True)
              files = find_prop_files(a.root)
              data, imports = {}, {}
              for p in files:
                  rel = os.path.relpath(p, a.root)
                  data[rel], imports[rel] = parse_prop(p)

              md = ["# Property report: %s" % a.label, "", "Root: `%s`  " % a.root, "Property files found: **%d**" % len(files), ""]
              if not files:
                  md.append("WARNING: no .prop files found in this tree.")
              md += ["## Files", ""] + ["- `%s` (%d keys)" % (r, len(k)) for r, k in data.items()] + [""]

              md += ["## Identity / version properties (every file that defines them)", "", "| key | value | file |", "|---|---|---|"]
              found = 0
              for rel, kv in data.items():
                  for k, v in kv.items():
                      if any(r.search(k) for r in KEY_RES):
                          md.append("| `%s` | `%s` | %s |" % (k, v, rel)); found += 1
              if not found:
                  md.append("| _none found_ | | |")
              md.append("")

              md += ["## Topic properties (bluetooth, display, sensors, ims, audio, ...)", "", "| key | value | file |", "|---|---|---|"]
              rows = [(k, v, rel) for rel, kv in data.items() for k, v in kv.items() if TOPIC_RE.search(k) and not any(r.search(k) for r in KEY_RES)]
              for k, v, rel in rows[:400]:
                  md.append("| `%s` | `%s` | %s |" % (k, v[:120], rel))
              if len(rows) > 400:
                  md.append("| _%d more rows in the JSON_ | | |" % (len(rows) - 400))
              md.append("")

              defs = defaultdict(dict)
              for rel, kv in data.items():
                  if VARIANT_RE.match(os.path.basename(rel)):
                      continue
                  for k, v in kv.items():
                      defs[k][rel] = v
              conflicts = {k: m for k, m in defs.items() if len(set(m.values())) > 1}
              md += ["## Same key, different values in different (non-variant) files", ""]
              if conflicts:
                  for k, m in sorted(conflicts.items())[:200]:
                      md.append("- `%s`: " % k + "; ".join("%s=`%s`" % (f, v[:60]) for f, v in m.items()))
              else:
                  md.append("_none_")
              md.append("")

              imp = {r: i for r, i in imports.items() if i}
              md += ["## import lines", ""] + (["- `%s` imports %s" % (r, i) for r, i in imp.items()] or ["_none_"]) + [""]

              variants = defaultdict(dict)
              for rel, kv in data.items():
                  m = VARIANT_RE.match(os.path.basename(rel))
                  if m and (not a.model or m.group("model") == a.model):
                      variants[m.group("sku") + "_" + m.group("model")] = (rel, kv)
              if variants:
                  md += ["## SKU/region variant prop files%s" % (" for model %s" % a.model if a.model else ""), "",
                         "The phone loads ONE of these at boot. The active one is not stored in the image; it must come from the phone.", "",
                         "| variant | file | keys | ro.vendor.build.fingerprint |", "|---|---|---|---|"]
                  for name, (rel, kv) in sorted(variants.items()):
                      md.append("| %s | %s | %d | `%s` |" % (name, rel, len(kv), kv.get("ro.vendor.build.fingerprint", kv.get("ro.build.fingerprint", "-"))))
                  allkeys = set()
                  for _, (_, kv) in variants.items():
                      allkeys |= set(kv)
                  diff = []
                  for k in sorted(allkeys):
                      vals = {n: kv.get(k) for n, (_, kv) in variants.items()}
                      if len(set(vals.values())) > 1:
                          diff.append((k, vals))
                  md += ["", "### Keys that differ between these variants (%d)" % len(diff), ""]
                  for k, vals in diff[:120]:
                      groups = defaultdict(list)
                      for n, v in vals.items():
                          groups[v].append(n)
                      md.append("- `%s`: " % k + " | ".join("`%s` -> %s" % ("(unset)" if v is None else v[:50], ",".join(ns)) for v, ns in groups.items()))
                  if len(diff) > 120:
                      md.append("- _%d more in JSON_" % (len(diff) - 120))
                  md.append("")

              with open(os.path.join(a.out, "props-%s.md" % a.label), "w") as f:
                  f.write("\n".join(md) + "\n")
              with open(os.path.join(a.out, "props-%s.json" % a.label), "w") as f:
                  json.dump({"label": a.label, "files": data, "imports": imports}, f, indent=1, sort_keys=True)
              print("props-%s: %d files, %d identity rows, %d topic rows" % (a.label, len(files), found, len(rows)))

          if __name__ == "__main__":
              main()
          EOF_TOOL
          cat > "$TOOLS/vintf_check.py" <<'EOF_TOOL'
          #!/usr/bin/env python3
          """Approximate VINTF compatibility check (NOT a replacement for AOSP checkvintf).

            vintf_check.py --device-roots vendor=/m/vendor odm=/m/odm --gsi-root /m/gsi --out DIR [--target-level 7]

          Check A: framework compatibility matrix (GSI) at the device's target FCM level  vs  device manifest (vendor+odm).
          Check B: device compatibility matrix (vendor)                                   vs  framework manifest (GSI).
          Differences from libvintf: AIDL versions are compared as 'device >= matrix minimum'; same-name HAL entries are
          treated as alternatives; 'native' HALs are skipped.
          """
          import argparse, glob, json, os, re, sys
          import xml.etree.ElementTree as ET

          def xml_files(root, patterns):
              out = []
              for p in patterns:
                  out += glob.glob(os.path.join(root, p))
              return sorted(set(f for f in out if os.path.isfile(f)))

          def load(path):
              try:
                  return ET.parse(path).getroot(), None
              except Exception as e:  # never swallow silently: callers record the error
                  return None, "%s: %s" % (path, e)

          def vtuple(s):
              m = re.fullmatch(r"(\d+)(?:\.(\d+))?", s.strip())
              return (int(m.group(1)), int(m.group(2) or 0)) if m else None

          def vrange(s):
              s = s.strip()
              m = re.fullmatch(r"(\d+)\.(\d+)-(\d+)", s)
              if m:
                  return ("hidl", int(m.group(1)), int(m.group(2)), int(m.group(3)))
              m = re.fullmatch(r"(\d+)\.(\d+)", s)
              if m:
                  return ("hidl", int(m.group(1)), int(m.group(2)), int(m.group(2)))
              m = re.fullmatch(r"(\d+)-(\d+)", s)
              if m:
                  return ("aidl", int(m.group(1)), int(m.group(2)))
              m = re.fullmatch(r"(\d+)", s)
              if m:
                  return ("aidl", int(m.group(1)), int(m.group(1)))
              return None

          def parse_manifest(path, root):
              hals = []
              for h in root.findall("hal"):
                  name = (h.findtext("name") or "").strip()
                  fmt = h.get("format", "hidl")
                  vers, inst = [], set()
                  for v in h.findall("version"):
                      if v.text:
                          vers.append(v.text.strip())
                  for fq in h.findall("fqname"):
                      t = (fq.text or "").strip()
                      m = re.fullmatch(r"@(\d+\.\d+)::(\w+)/(.+)", t)
                      if m:
                          vers.append(m.group(1)); inst.add((m.group(2), m.group(3)))
                          continue
                      m = re.fullmatch(r"(\w+)/(.+)", t)
                      if m:
                          inst.add((m.group(1), m.group(2)))
                  for itf in h.findall("interface"):
                      iname = (itf.findtext("name") or "").strip()
                      for i in itf.findall("instance"):
                          if i.text:
                              inst.add((iname, i.text.strip()))
                  if fmt == "aidl" and not vers:
                      vers = ["1"]
                  hals.append({"name": name, "format": fmt, "versions": sorted(set(vers)), "instances": sorted(inst),
                               "max_level": h.get("max-level"), "min_level": h.get("min-level"), "source": path})
              return hals

          def parse_matrix(path, root):
              hals = []
              for h in root.findall("hal"):
                  name = (h.findtext("name") or "").strip()
                  ranges = [r for r in (vrange(v.text) for v in h.findall("version") if v.text) if r]
                  want = []
                  for itf in h.findall("interface"):
                      iname = (itf.findtext("name") or "").strip()
                      for i in itf.findall("instance"):
                          if i.text:
                              want.append((iname, i.text.strip(), False))
                      for i in itf.findall("regex-instance"):
                          if i.text:
                              want.append((iname, i.text.strip(), True))
                  hals.append({"name": name, "format": h.get("format", "hidl"), "optional": h.get("optional", "false") == "true",
                               "ranges": ranges, "want": want, "source": path})
              return hals

          def level_of(root):
              try:
                  return int(root.get("level")) if root.get("level") else None
              except ValueError:
                  return None

          def version_ok(entry, provided):
              """entry: matrix hal; provided: manifest hals (same name+format)."""
              if entry["format"] == "native":
                  return True, "native (skipped)"
              if not entry["ranges"]:
                  return (bool(provided), "no version required")
              for p in provided:
                  for pv in p["versions"]:
                      for r in entry["ranges"]:
                          if r[0] == "hidl":
                              t = vtuple(pv)
                              if t and t[0] == r[1] and t[1] >= r[2]:
                                  return True, "device %s satisfies %d.%d-%d" % (pv, r[1], r[2], r[3])
                          else:
                              t = vtuple(pv)
                              if t and t[0] >= r[1]:
                                  return True, "device AIDL v%s >= required v%d (approx.)" % (pv, r[1])
              have = sorted({v for p in provided for v in p["versions"]})
              return False, "device provides %s, matrix wants %s" % (have or "none", ", ".join(
                  ("%d.%d-%d" % r[1:] if r[0] == "hidl" else "%d-%d" % r[1:]) for r in entry["ranges"]))

          def instances_ok(entry, provided):
              have = {(i, n) for p in provided for (i, n) in p["instances"]}
              missing = []
              for iname, inst, rx in entry["want"]:
                  if rx:
                      ok = any(i == iname and re.fullmatch(inst, n) for (i, n) in have)
                  else:
                      ok = (iname, inst) in have
                  if not ok:
                      missing.append("%s/%s" % (iname, inst))
              return (not missing), missing

          def evaluate(matrix_hals, manifest_hals, level=None):
              mf = []
              for m in manifest_hals:
                  if level is not None:
                      if m["max_level"] and level > int(m["max_level"]):
                          continue
                      if m["min_level"] and level < int(m["min_level"]):
                          continue
                  mf.append(m)
              groups = {}
              for e in matrix_hals:
                  groups.setdefault(e["name"], []).append(e)
              rows = []
              for name, entries in sorted(groups.items()):
                  results, satisfied = [], None
                  for e in entries:
                      prov = [m for m in mf if m["name"] == name and m["format"] == e["format"]]
                      if not prov:
                          results.append((e, False, "not provided as %s" % e["format"]))
                          continue
                      vok, vmsg = version_ok(e, prov)
                      iok, imiss = instances_ok(e, prov)
                      ok = vok and iok
                      results.append((e, ok, vmsg + ("" if iok else "; missing instances: " + ", ".join(imiss))))
                      if ok and satisfied is None:
                          satisfied = (e, vmsg)
                  required = any(not e["optional"] for e in entries)
                  if satisfied:
                      verdict = "OK"
                  elif required:
                      verdict = "UNSATISFIED"
                  else:
                      verdict = "optional, not provided"
                  rows.append({"hal": name, "verdict": verdict, "required": required,
                               "entries": [{"format": e["format"], "optional": e["optional"], "ok": ok, "detail": d,
                                            "matrix": os.path.basename(e["source"])} for e, ok, d in results]})
              return rows

          def gather_manifests(roots, errors):
              hals, meta = [], []
              for label, root in roots:
                  for f in xml_files(root, ["etc/vintf/manifest.xml", "etc/vintf/manifest/*.xml", "etc/vintf/manifest_*.xml"]):
                      r, err = load(f)
                      if err:
                          errors.append(err); continue
                      if r.tag != "manifest":
                          continue
                      meta.append({"label": label, "file": os.path.relpath(f, root), "type": r.get("type"),
                                   "target_level": r.get("target-level"), "version": r.get("version")})
                      hals += parse_manifest("%s:%s" % (label, os.path.relpath(f, root)), r)
              return hals, meta

          def table(rows, only_problems):
              out = ["| HAL | verdict | detail |", "|---|---|---|"]
              n = 0
              for r in rows:
                  if only_problems and r["verdict"] == "OK":
                      continue
                  det = "; ".join("%s%s: %s" % (e["format"], " (optional)" if e["optional"] else "", e["detail"]) for e in r["entries"])
                  out.append("| `%s` | %s | %s |" % (r["hal"], r["verdict"], det[:300]))
                  n += 1
              if not n:
                  out.append("| _none_ | | |")
              return out

          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument("--device-roots", nargs="+", required=True, help="label=path ...")
              ap.add_argument("--gsi-root", required=True)
              ap.add_argument("--out", required=True)
              ap.add_argument("--target-level", default="")
              ap.add_argument("--focus", default="bluetooth|sensors|light|radio|audio|power|thermal|biometrics|camera|wifi|health|usb|gnss")
              a = ap.parse_args()
              os.makedirs(a.out, exist_ok=True)
              errors = []
              droots = [tuple(x.split("=", 1)) for x in a.device_roots]
              dev_hals, dev_meta = gather_manifests(droots, errors)
              gsi = a.gsi_root
              gsi_sys = os.path.join(gsi, "system") if os.path.isdir(os.path.join(gsi, "system", "etc")) else gsi
              fw_manifest_hals, fw_meta = gather_manifests([("gsi:system", gsi_sys), ("gsi:product", os.path.join(gsi_sys, "product")),
                                                            ("gsi:system_ext", os.path.join(gsi_sys, "system_ext"))], errors)

              target = int(a.target_level) if a.target_level else None
              declared = sorted({m["target_level"] for m in dev_meta if m["target_level"]})
              if target is None and declared:
                  try:
                      target = int(declared[0])
                  except ValueError:
                      pass

              fw_matrices = []
              for base in (gsi_sys, os.path.join(gsi_sys, "product"), os.path.join(gsi_sys, "system_ext")):
                  for f in xml_files(base, ["etc/vintf/*matrix*.xml"]):
                      r, err = load(f)
                      if err:
                          errors.append(err); continue
                      if r.tag == "compatibility-matrix":
                          fw_matrices.append((f, r, level_of(r)))
              levels = sorted({lv for _, _, lv in fw_matrices if lv is not None})

              dev_matrices = []
              for label, root in droots:
                  for f in xml_files(root, ["etc/vintf/compatibility_matrix*.xml", "etc/vintf/*matrix*.xml"]):
                      r, err = load(f)
                      if err:
                          errors.append(err); continue
                      if r.tag == "compatibility-matrix" and r.get("type") == "device":
                          dev_matrices.append((f, r))

              md = ["# VINTF compatibility (approximate)", "",
