          #!/usr/bin/env python3
          """Init service inventory.  rc_report.py --roots label=dir ... --out DIR [--interest REGEX]"""
          import argparse, json, os, re

          DEFAULT_INTEREST = r"blue|\bbt\b|hci|sensor|light|backlight|\bims|vowifi|volte|ril|radio|connmgr|wcn|audio|thermal|power|unisoc|sprd|unipnp|health|usb|gnss|camera|fingerprint|biometric"

          def logical_lines(path):
              buf = ""
              with open(path, "r", errors="replace") as f:
                  for raw in f:
                      line = raw.rstrip("\n")
                      if line.rstrip().endswith("\\"):
                          buf += line.rstrip()[:-1] + " "
                          continue
                      buf += line
                      line, buf = buf, ""
                      line = line.split("#", 1)[0].rstrip()
                      if line.strip():
                          yield line
              if buf.strip():
                  yield buf

          def parse_rc(path):
              services, triggers = [], []
              cur = None
              for line in logical_lines(path):
                  toks = line.split()
                  indented = line[:1] in (" ", "\t")
                  if not indented and toks[0] == "service" and len(toks) >= 3:
                      cur = {"name": toks[1], "exec": " ".join(toks[2:]), "file": path, "opts": {}, "interface": [], "disabled": False,
                             "oneshot": False}
                      services.append(cur); continue
                  if not indented and toks[0] == "on":
                      cur = {"trigger": " ".join(toks[1:]), "cmds": [], "file": path}
                      triggers.append(cur); continue
                  if not indented:
                      cur = None; continue
                  if cur is None:
                      continue
                  if "trigger" in cur:
                      if toks[0] in ("start", "stop", "restart", "enable", "setprop"):
                          cur["cmds"].append(" ".join(toks))
                  else:
                      k = toks[0]
                      if k == "disabled":
                          cur["disabled"] = True
                      elif k == "oneshot":
                          cur["oneshot"] = True
                      elif k == "interface":
                          cur["interface"].append(" ".join(toks[1:]))
                      else:
                          cur["opts"].setdefault(k, []).append(" ".join(toks[1:]))
              return services, triggers

          def scan(root):
              sv, tr = [], []
              for d, _, files in os.walk(root, followlinks=False):
                  for n in files:
                      if n.endswith(".rc"):
                          p = os.path.join(d, n)
                          if os.path.isfile(p):
                              try:
                                  s, t = parse_rc(p)
                              except OSError:
                                  continue
                              for x in s + t:
                                  x["file"] = os.path.relpath(x["file"], root)
                              sv += s; tr += t
              return sv, tr

          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument("--roots", nargs="+", required=True)
              ap.add_argument("--out", required=True)
              ap.add_argument("--interest", default=DEFAULT_INTEREST)
              a = ap.parse_args()
              os.makedirs(a.out, exist_ok=True)
              rx = re.compile(a.interest, re.I)
              allres, names = {}, {}
              md = ["# Init service inventory", ""]
              for spec in a.roots:
                  label, root = spec.split("=", 1)
                  sv, tr = scan(root)
                  allres[label] = {"services": sv, "triggers": tr}
                  names[label] = {s["name"] for s in sv}
                  md += ["## %s: %d services, %d triggers" % (label, len(sv), len(tr)), "",
                         "| service | executable | class | user | disabled | interfaces | file |", "|---|---|---|---|---|---|---|"]
                  for s in sorted(sv, key=lambda x: x["name"]):
                      if rx.search(s["name"] + " " + s["exec"] + " " + " ".join(s["interface"])):
                          o = s["opts"]
                          md.append("| `%s` | `%s` | %s | %s | %s | %s | %s |" % (
                              s["name"], s["exec"][:70], ",".join(o.get("class", [])), ",".join(o.get("user", [])), "yes" if s["disabled"] else "",
                              "; ".join(s["interface"])[:80], s["file"]))
                  md += ["", "### Property triggers that start/stop/enable an interesting service", ""]
                  hit = 0
                  for t in tr:
                      if t["trigger"].startswith("property:") and any(rx.search(c) for c in t["cmds"]):
                          md.append("- `on %s` (%s): %s" % (t["trigger"], t["file"], "; ".join(c for c in t["cmds"] if rx.search(c))[:200])); hit += 1
                  if not hit:
                      md.append("_none_")
                  md.append("")
              labels = list(names)
              if len(labels) >= 2:
                  base = labels[-1]
                  md += ["## Interesting services by side", ""]
                  for l in labels:
                      md.append("- **%s**: %s" % (l, ", ".join("`%s`" % n for n in sorted(names[l]) if rx.search(n)) or "_none_"))
              with open(os.path.join(a.out, "init-services.md"), "w") as f:
                  f.write("\n".join(md) + "\n")
              with open(os.path.join(a.out, "init-services.json"), "w") as f:
                  json.dump(allres, f, indent=1)
              print("rc: " + ", ".join("%s=%d services" % (l, len(allres[l]["services"])) for l in allres))

          if __name__ == "__main__":
              main()
