          #!/usr/bin/env python3
          """Overlay (RRO) audit using aapt.

          overlay_audit.py --target-apk GSI/system/framework/framework-res.apk --scan stock-vendor=DIR stock-product=DIR gsi=DIR --out DIR
          For every APK under any directory named 'overlay': target package, priority, static flag, activation condition
          (requiredSystemPropertyName/Value), and - for overlays that target the framework - which resource names exist in the
          GSI's framework-res (those WILL override crDroid's values) and which do not (inert).
          """
          import argparse, json, os, re, shutil, subprocess

          HOT = re.compile(r"bluetooth|bt_|brightness|backlight|autobright|sensor|light|ims|volte|vowifi|telephony|radio|refresh|"
                           r"display|thermal|wifi|audio|power|screen_off|doze|nits|lux", re.I)
          ATTR = re.compile(r'A: (?:android:)?(\w+)(?:\([^)]*\))?=(?:"([^"]*)"|\(type 0x[0-9a-fA-F]+\)(0x[0-9a-fA-F]+))')
          RES = re.compile(r"resource 0x[0-9a-fA-F]+ (?:[^:\s]+:)?(\w+)/(\S+?):")

          def run(cmd, timeout=60):
              try:
                  p = subprocess.run(cmd, capture_output=True, text=True, timeout=timeout, errors="replace")
                  return p.returncode, p.stdout
              except (OSError, subprocess.TimeoutExpired) as e:
                  return 1, "ERR %s" % e

          def parse_xmltree(text):
              info = {"package": None, "overlay": {}}
              in_overlay = False
              for line in text.splitlines():
                  s = line.strip()
                  if s.startswith("E: overlay"):
                      in_overlay = True; continue
                  if s.startswith("E: ") and not s.startswith("E: overlay"):
                      in_overlay = False
                  m = ATTR.search(s)
                  if not m:
                      continue
                  k, sv, hv = m.group(1), m.group(2), m.group(3)
                  if k == "package" and sv:
                      info["package"] = sv
                  elif in_overlay:
                      info["overlay"][k] = sv if sv is not None else hv
              return info

          def parse_resources(text):
              names = set()
              for line in text.splitlines():
                  m = RES.search(line)
                  if m:
                      names.add("%s/%s" % (m.group(1), m.group(2)))
              return names

          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument("--target-apk", default="")
              ap.add_argument("--scan", nargs="+", required=True)
              ap.add_argument("--out", required=True)
              ap.add_argument("--aapt", default="aapt")
              a = ap.parse_args()
              os.makedirs(a.out, exist_ok=True)
              if not shutil.which(a.aapt):
                  msg = "aapt not found; overlay audit skipped (install the 'aapt' package)."
                  open(os.path.join(a.out, "overlays.md"), "w").write("# Overlay audit\n\n" + msg + "\n")
                  print("overlays: " + msg); return
              target_names = set()
              if a.target_apk and os.path.isfile(a.target_apk):
                  rc, out = run([a.aapt, "dump", "resources", a.target_apk], 180)
                  target_names = parse_resources(out)
              rows = []
              for spec in a.scan:
                  label, root = spec.split("=", 1)
                  for d, dirs, files in os.walk(root, followlinks=False):
                      if "overlay" not in os.path.relpath(d, root).lower().split(os.sep) and "overlay" not in os.path.basename(d).lower():
                          continue
                      for n in files:
                          if not n.endswith(".apk"):
                              continue
                          p = os.path.join(d, n)
                          if os.path.islink(p) or os.path.getsize(p) > 30 * 1024 * 1024:
                              continue
                          rc, xt = run([a.aapt, "dump", "xmltree", p, "AndroidManifest.xml"])
                          info = parse_xmltree(xt) if rc == 0 else {"package": None, "overlay": {}}
                          rc2, rs = run([a.aapt, "dump", "resources", p])
                          names = parse_resources(rs) if rc2 == 0 else set()
                          ov = info["overlay"]
                          tgt = ov.get("targetPackage")
                          hit = sorted(x for x in names if HOT.search(x))
                          row = {"label": label, "file": os.path.relpath(p, root), "package": info["package"], "target": tgt,
                                 "priority": ov.get("priority"), "static": ov.get("isStatic"),
                                 "condition": ("%s=%s" % (ov.get("requiredSystemPropertyName"), ov.get("requiredSystemPropertyValue"))
                                               if ov.get("requiredSystemPropertyName") else ""),
                                 "resources": len(names), "parse_ok": rc == 0 and rc2 == 0, "hot": hit}
                          if tgt == "android" and target_names:
                              row["override_existing"] = sorted(x for x in names if x in target_names)
                              row["not_in_target"] = sorted(x for x in names if x not in target_names)
                          rows.append(row)
              md = ["# Overlay audit", "", "Target framework-res resources known: %d" % len(target_names), ""]
              for label in sorted({r["label"] for r in rows}):
                  rs = [r for r in rows if r["label"] == label]
                  md += ["## %s: %d overlay APKs" % (label, len(rs)), "",
                         "| apk | target | prio | static | activation condition | res | overrides existing | not in target | hot resources |", "|---|---|---|---|---|---|---|---|---|"]
                  for r in sorted(rs, key=lambda x: x["file"]):
                      interesting = r["hot"] or r["condition"] or (r.get("override_existing") and "treble-overlay" not in r["file"])
                      if not interesting and len(rs) > 60:
                          continue
                      md.append("| %s | %s | %s | %s | %s | %d | %s | %s | %s |" % (
                          r["file"], r["target"], r["priority"], r["static"], r["condition"], r["resources"],
                          len(r["override_existing"]) if "override_existing" in r else "-", len(r["not_in_target"]) if "not_in_target" in r else "-",
                          ", ".join(r["hot"][:6]) + (" ..." if len(r["hot"]) > 6 else "")))
                  unparsed = [r["file"] for r in rs if not r["parse_ok"]]
                  if unparsed:
                      md += ["", "Could not parse: " + ", ".join(unparsed[:30])]
                  md.append("")
              open(os.path.join(a.out, "overlays.md"), "w").write("\n".join(md) + "\n")
              json.dump(rows, open(os.path.join(a.out, "overlays.json"), "w"), indent=1)
              print("overlays: %d APKs audited" % len(rows))

          if __name__ == "__main__":
              main()
