name: RMX3834 GSI builder

# Put this file at .github/workflows/rmx3834-gsi.yml
# Optional files in the repo (only read when the matching switch is on):
#   rmx3834/system.prop   -> lines appended to system build.prop (extra_props)
#   rmx3834/debloat.txt   -> exact paths relative to /system, one per line (debloat)

on:
  workflow_dispatch:
    inputs:
      gsi_url:
        description: "Direct link to GSI (.img, .img.xz, .zip, .7z, .gz)"
        required: true
        type: string
      out_fs:
        description: "Output filesystem"
        type: choice
        options: [erofs, ext4]
        default: erofs
      strip_old_vndk:
        description: "Remove VNDK v28-v32 apexes (your vendor is VNDK 33)"
        type: boolean
        default: false
      strip_cjk_fonts:
        description: "Remove CJK fonts AND their fonts.xml entries (keeps Bengali)"
        type: boolean
        default: false
      extra_props:
        description: "Append rmx3834/system.prop to build.prop"
        type: boolean
        default: false
      debloat:
        description: "Delete exact paths listed in rmx3834/debloat.txt"
        type: boolean
        default: false
      pin_vendor_fingerprint:
        description: "Optional: abort unless vendor.img has this ro.vendor.build.fingerprint"
        type: string
        default: ""
      max_size_mb:
        description: "Abort if system.img is bigger than this (0 = skip). Get your limit from lpdump."
        type: string
        default: "0"

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  DEVICE_TAG: device-Realme-Note-50
  WORK: /work

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk and install tools
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 erofs-utils e2fsprogs \
            rsync attr xz-utils p7zip-full unzip file python3 xxd
          sudo mkdir -p "$WORK"/{dl,vendor,src,out,mnt_v,mnt_s,mnt_o}
          sudo chown -R "$USER" "$WORK"
          mkfs.erofs --version || true
          cat > "$WORK/unsparse.py" <<'PYU'
          import struct, sys
          src, dst = sys.argv[1], sys.argv[2]
          with open(src, "rb") as f, open(dst, "wb") as o:
              magic, major, minor, fhs, chs, blk, tblks, tchunks, crc = struct.unpack("<IHHHHIIII", f.read(28))
              assert magic == 0xED26FF3A, "not a sparse image"
              f.seek(fhs)
              for _ in range(tchunks):
                  ctype, _r, csz, tsz = struct.unpack("<HHII", f.read(12))
                  n = csz * blk
                  if ctype == 0xCAC1:
                      left = n
                      while left:
                          b = f.read(min(left, 1 << 24)); o.write(b); left -= len(b)
                  elif ctype == 0xCAC2:
                      pat = f.read(4) * (blk // 4)
                      for _ in range(csz):
                          o.write(pat)
                  elif ctype == 0xCAC3:
                      o.seek(n, 1)
                  elif ctype == 0xCAC4:
                      f.read(4)
                  else:
                      raise SystemExit("unknown chunk type %x" % ctype)
              o.truncate(tblks * blk)
          PYU
          cat > "$WORK/lib.sh" <<'LIB'
          unsparse() { # in out
            if [ "$(head -c4 "$1" | xxd -p)" = "3aff26ed" ]; then python3 "$WORK/unsparse.py" "$1" "$2"; rm -f "$1"; else mv -f "$1" "$2"; fi
          }
          fstype() {
            if [ "$(dd if="$1" bs=1 skip=1024 count=4 2>/dev/null | xxd -p)" = "e2e1f5e0" ]; then echo erofs
            elif [ "$(dd if="$1" bs=1 skip=1080 count=2 2>/dev/null | xxd -p)" = "53ef" ]; then echo ext4
            else echo unknown; fi
          }
          mount_img() { # img dir
            local t; t="$(fstype "$1")"
            case "$t" in
              erofs) sudo mount -t erofs -o ro,loop "$1" "$2" ;;
              ext4)  sudo mount -t ext4 -o ro,loop,noload "$1" "$2" ;;
              *) echo "Unknown filesystem in $1"; return 1 ;;
            esac
          }
          LIB

      # ---------- 1. Check your real vendor ----------
      - name: Check vendor.img from the release
        env:
          GH_TOKEN: ${{ github.token }}
          PIN: ${{ inputs.pin_vendor_fingerprint }}
        run: |
          source "$WORK/lib.sh"
          gh release download "$DEVICE_TAG" --repo "$GITHUB_REPOSITORY" -p 'vendor.img' -D "$WORK/vendor"
          unsparse "$WORK/vendor/vendor.img" "$WORK/vendor/vendor.raw"
          mount_img "$WORK/vendor/vendor.raw" "$WORK/mnt_v"
          BP="$WORK/mnt_v/build.prop"
          VNDK="$(grep -h '^ro.vndk.version=' "$BP" | head -1 | cut -d= -f2)"
          VFP="$(grep -h '^ro.vendor.build.fingerprint=' "$BP" | head -1 | cut -d= -f2)"
          echo "vendor VNDK: $VNDK"
          echo "vendor fingerprint: $VFP"
          {
            echo "### Vendor"
            echo "- VNDK: \`$VNDK\`"
            echo "- Fingerprint: \`$VFP\`"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$VNDK" = "33" ] || { echo "::error::Vendor VNDK is '$VNDK', expected 33"; exit 1; }
          if [ -n "$PIN" ] && [ "$PIN" != "$VFP" ]; then
            echo "::error::Vendor fingerprint does not match the pin"; exit 1
          fi
          sudo umount "$WORK/mnt_v"
          rm -f "$WORK/vendor/vendor.raw" "$WORK/vendor/vendor.img"

      # ---------- 2. Get and unpack the GSI ----------
      - name: Download and unpack GSI
        env:
          GSI_URL: ${{ inputs.gsi_url }}
        run: |
          source "$WORK/lib.sh"
          cd "$WORK/dl"
          aria2c -x16 -s16 -k1M --allow-overwrite=true -o gsi.download "$GSI_URL"
          mkdir -p x
          case "$(file -b gsi.download)" in
            Zip*)        unzip -o -q gsi.download -d x ;;
            XZ*)         xz -dc gsi.download > x/system.img ;;
            gzip*)       gzip -dc gsi.download > x/system.img ;;
            7-zip*)      7z x -y -ox gsi.download >/dev/null ;;
            *)           mv gsi.download x/system.img ;;
          esac
          rm -f gsi.download
          # nested archives (e.g. .img.xz inside a zip)
          for f in $(find x -type f \( -name '*.xz' -o -name '*.gz' \)); do
            case "$f" in *.xz) xz -dk "$f" ;; *.gz) gzip -dk "$f" ;; esac
          done
          IMG="$(find x -type f -iname '*.img' -printf '%s %p\n' | sort -rn | head -1 | cut -d' ' -f2-)"
          [ -n "$IMG" ] || { echo "::error::No .img found in the download"; exit 1; }
          echo "Using $IMG"
          unsparse "$IMG" "$WORK/src/system.raw"
          rm -rf x
          echo "Source filesystem: $(fstype "$WORK/src/system.raw")"

      # ---------- 3. Copy tree with all xattrs (SELinux labels, capabilities) ----------
      - name: Extract tree
        run: |
          source "$WORK/lib.sh"
          mount_img "$WORK/src/system.raw" "$WORK/mnt_s"
          sudo mkdir -p "$WORK/tree"
          sudo rsync -aHAX --numeric-ids "$WORK/mnt_s"/ "$WORK/tree"/
          sudo umount "$WORK/mnt_s"
          rm -f "$WORK/src/system.raw"
          T="$WORK/tree"
          if [ -f "$T/system/build.prop" ]; then SYS="$T/system"; else SYS="$T"; fi
          echo "T=$T" >> "$GITHUB_ENV"
          echo "SYS=$SYS" >> "$GITHUB_ENV"
          grep -h -E '^ro\.(system\.)?build\.(version\.release|version\.sdk|fingerprint)=' "$SYS/build.prop" | tee -a "$GITHUB_STEP_SUMMARY"

      # ---------- 4. Optional tweaks, each one its own switch ----------
      - name: Strip old VNDK apexes
        if: ${{ inputs.strip_old_vndk }}
        run: |
          sudo find "$T" -path '*/apex/*' -regextype posix-extended \
            -regex '.*/com\.android\.vndk\.v(28|29|30|31|32)(\.apex|\.capex)?$' \
            -print -exec rm -rf {} + || true

      - name: Strip CJK fonts (files and XML references together)
        if: ${{ inputs.strip_cjk_fonts }}
        run: |
          sudo python3 - "$SYS" <<'PY'
          import os, sys
          import xml.etree.ElementTree as ET
          root = sys.argv[1]
          fonts = os.path.join(root, "fonts")
          etc = os.path.join(root, "etc")
          gone = set()
          for n in os.listdir(fonts):
              if "cjk" in n.lower():
                  os.remove(os.path.join(fonts, n)); gone.add(n)
          print("removed font files:", sorted(gone))
          for n in os.listdir(etc):
              if "font" not in n.lower() or not n.endswith(".xml"):
                  continue
              p = os.path.join(etc, n)
              tree = ET.parse(p)
              changed = False
              for fam in list(tree.getroot().iter("family")):
                  for f in list(fam.findall("font")):
                      if (f.text or "").strip() in gone:
                          fam.remove(f); changed = True
                  if not fam.findall("font"):
                      tree.getroot().remove(fam); changed = True
              if changed:
                  tree.write(p, encoding="utf-8", xml_declaration=True)
                  print("rewrote", p)
          PY

      - name: Append extra props
        if: ${{ inputs.extra_props }}
        run: |
          test -f rmx3834/system.prop || { echo "::error::rmx3834/system.prop not found"; exit 1; }
          { echo; echo "# --- rmx3834 extra props ---"; cat rmx3834/system.prop; } | sudo tee -a "$SYS/build.prop" >/dev/null

      - name: Debloat exact paths
        if: ${{ inputs.debloat }}
        run: |
          test -f rmx3834/debloat.txt || { echo "::error::rmx3834/debloat.txt not found"; exit 1; }
          while IFS= read -r line; do
            line="${line%%#*}"; line="$(echo "$line" | xargs)"
            [ -z "$line" ] && continue
            case "$line" in *..*|*'*'*|*'?'*|/*) echo "::warning::skipping unsafe line: $line"; continue ;; esac
            if [ -e "$SYS/$line" ]; then sudo rm -rf "${SYS:?}/$line"; echo "removed $line"; else echo "::warning::not found: $line"; fi
          done < rmx3834/debloat.txt

      # ---------- 5. Build ----------
      - name: Build image
        env:
          OUT_FS: ${{ inputs.out_fs }}
        run: |
          OUT="$WORK/out/system.img"
          if [ "$OUT_FS" = "erofs" ]; then
            # Flags match your kernel's probe: big_pcluster + compr_cfgs yes,
            # ztailpacking / fragments / lzma no.
            sudo mkfs.erofs -zlz4hc,12 -C16384 "$OUT" "$T"
          else
            SIZE=$(( $(sudo du -sm "$T" | cut -f1) * 106 / 100 + 96 ))
            truncate -s "${SIZE}M" "$OUT"
            sudo mke2fs -q -t ext4 -b 4096 -L system -m 0 -O ^has_journal -d "$T" "$OUT"
            sudo e2fsck -fy "$OUT" || true
            sudo resize2fs -M "$OUT"
          fi
          ls -l "$OUT"

      # ---------- 6. Verify before upload ----------
      - name: Verify image
        env:
          MAXMB: ${{ inputs.max_size_mb }}
        run: |
          source "$WORK/lib.sh"
          OUT="$WORK/out/system.img"
          BYTES=$(stat -c %s "$OUT")
          if [ "$MAXMB" != "0" ] && [ "$BYTES" -gt $(( MAXMB * 1024 * 1024 )) ]; then
            echo "::error::system.img is $((BYTES/1024/1024)) MB, limit is $MAXMB MB"; exit 1
          fi
          mount_img "$OUT" "$WORK/mnt_o"
          # build.prop must be present
          if [ -f "$WORK/mnt_o/system/build.prop" ]; then P="$WORK/mnt_o/system/build.prop"; else P="$WORK/mnt_o/build.prop"; fi
          test -f "$P"
          # security.* xattrs (SELinux labels, file capabilities) must match the tree we fed in
          dump() { (cd "$1" && sudo getfattr -R -h -d -m '^security\.' . 2>/dev/null | LC_ALL=C sort); }
          dump "$T" > "$WORK/a.txt"
          dump "$WORK/mnt_o" > "$WORK/b.txt"
          if diff -q "$WORK/a.txt" "$WORK/b.txt" >/dev/null; then
            echo "security xattrs identical ($(wc -l < "$WORK/a.txt") lines)"
          else
            diff "$WORK/a.txt" "$WORK/b.txt" | head -40
            echo "::error::security xattrs differ between tree and built image"; exit 1
          fi
          sudo umount "$WORK/mnt_o"
          sha256sum "$OUT" | tee "$WORK/out/system.img.sha256"
          {
            echo "### Output"
            echo "- Size: $((BYTES/1024/1024)) MB"
            echo "- SHA256: \`$(cut -d' ' -f1 "$WORK/out/system.img.sha256")\`"
          } >> "$GITHUB_STEP_SUMMARY"
          cat > "$WORK/out/FLASH.txt" <<'TXT'
          Flash (fastbootd, because system is a logical partition):
            adb reboot fastboot
            fastboot --disable-verity --disable-verification flash vbmeta_a vbmeta.img   # your stock vbmeta.img
            fastboot flash system_a system.img
            fastboot -w
          Stock product, system_ext, odm and vendor are NOT touched.
          Keep a stock system.img ready.
          TXT

      - uses: actions/upload-artifact@v4
        with:
          name: rmx3834-system
          path: |
            /work/out/system.img
            /work/out/system.img.sha256
            /work/out/FLASH.txt
          compression-level: 0
          retention-days: 7
