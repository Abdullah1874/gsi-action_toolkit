name: Perfect Realme Note 50 EROFS GSI Builder

on:
  workflow_dispatch:
    inputs:
      gsi_url:
        description: 'Direct GitHub Release URL for crDroid 12 GSI (.img.xz)'
        required: true
        type: string

jobs:
  build_erofs:
    runs-on: ubuntu-24.04
    steps:
      - name: Free Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc "/usr/local/share/boost"

      - name: Install Build Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            aria2 \
            erofs-utils \
            android-sdk-libsparse-utils \
            xz-utils \
            p7zip-full \
            e2fsprogs \
            attr \
            python3 \
            file

      - name: Download & Extract Base EXT4 GSI
        run: |
          mkdir -p work mnt_gsi output
          aria2c -x16 -s16 -k1M --file-allocation=none -o work/archive "${{ inputs.gsi_url }}"

          if file work/archive | grep -qi "HTML"; then
            echo "ERROR: Downloaded an HTML webpage instead of the GSI file!"
            exit 1
          fi

          cd work
          if file archive | grep -qi "XZ compressed"; then
            xz -dc -T0 archive > ../ext4.img
          else
            7z x archive -y
            IMG_FILE=$(find . -maxdepth 2 -type f -size +500M | head -n 1)
            mv "$IMG_FILE" ../ext4.img
          fi
          cd ..
          rm -rf work

          if file ext4.img | grep -q "sparse"; then
            simg2img ext4.img raw.img && mv raw.img ext4.img
          fi

      - name: Slim Bloat & Inject Realme Note 50 (RMX3834) Tuning
        run: |
          truncate -s +512M ext4.img
          e2fsck -f -y ext4.img || true
          resize2fs -f ext4.img
          e2fsck -E unshare_blocks -f -y ext4.img || true
          sudo mount -t ext4 -o loop,rw ext4.img mnt_gsi

          SYS_ROOT="mnt_gsi/system"
          [[ ! -d "$SYS_ROOT/app" && -d "mnt_gsi/app" ]] && SYS_ROOT="mnt_gsi"

          echo "=== 1. Stripping ~450MB Unused Legacy VNDKs (v28-v32), CJK Fonts & Foreign Overlays ==="
          for v in 28 29 30 31 32; do
            sudo rm -rf "$SYS_ROOT/system_ext/apex/com.android.vndk.v${v}"* \
                        "$SYS_ROOT/apex/com.android.vndk.v${v}"*
          done

          # Remove 200MB+ Chinese/Japanese/Korean fonts (keeps English & Bengali NotoSansBengali intact)
          sudo find "$SYS_ROOT/fonts" -type f \( -name "NotoSansCJK*" -o -name "NotoSerifCJK*" \) -delete 2>/dev/null || true
          sudo rm -rf "$SYS_ROOT/recovery-from-boot.p" "$SYS_ROOT/bin/install-recovery.sh" 2>/dev/null || true

          # Remove foreign brand overlays (keep Realme/Oppo/Unisoc/Sprd overlays!)
          sudo find "$SYS_ROOT/product/overlay" -type f \( \
            -iname "*xiaomi*" -o -iname "*redmi*" -o -iname "*poco*" -o \
            -iname "*samsung*" -o -iname "*huawei*" -o -iname "*honor*" -o \
            -iname "*asus*" -o -iname "*rog*" -o -iname "*lenovo*" -o \
            -iname "*motorola*" -o -iname "*nokia*" -o -iname "*sony*" -o -iname "*lge*" \
          \) -delete 2>/dev/null || true

          echo "=== 2. Preserving Original build.prop SELinux Label & Injecting Realme Note 50 Props ==="
          ORIG_CTX=$(sudo getfattr --only-values -n security.selinux "$SYS_ROOT/build.prop" 2>/dev/null | tr -d '\0' || echo "u:object_r:system_file:s0")

          sudo tee -a "$SYS_ROOT/build.prop" > /dev/null << 'EOF'

          # --- Realme Note 50 (RMX3834 - Unisoc T612) Hardware & Speed Patch ---
          persist.sys.qcom-brightness=4095
          persist.sys.phh.backlight.scale=1
          ro.surface_flinger.use_content_detection_for_refresh_rate=false
          debug.sf.latch_unsignaled=1
          debug.sf.disable_backpressure=1
          debug.sf.enable_hwc_vds=0
          persist.sys.phh.disable_a2dp_offload=true
          ro.telephony.sim_slots.count=2
          persist.dbg.volte_avail_ovr=1
          persist.dbg.vt_avail_ovr=1
          persist.dbg.wfc_avail_ovr=1
          dalvik.vm.heapstartsize=8m
          dalvik.vm.heapgrowthlimit=256m
          dalvik.vm.heapsize=512m
          dalvik.vm.heaptargetutilization=0.75
          dalvik.vm.heapminfree=2m
          dalvik.vm.heapmaxfree=8m
          EOF

          sudo setfattr -n security.selinux -v "$ORIG_CTX" "$SYS_ROOT/build.prop"

      - name: Extract 1:1 SELinux & UID/GID Map and Build EROFS
        run: |
          echo "=== Extracting Exact Original SELinux xattrs & Permissions from EXT4 Image ==="
          sudo python3 - << 'EOF'
          import os, re, stat

          root_dir = "mnt_gsi"
          fs_config_lines = []
          fc_lines = []

          for dirpath, dirnames, filenames in os.walk(root_dir):
              rel_dir = os.path.relpath(dirpath, root_dir)
              items = [ (dirpath, rel_dir) ] + [ (os.path.join(dirpath, f), os.path.join(rel_dir, f) if rel_dir != "." else f) for f in filenames ]
              for full_path, rel_path in items:
                  st = os.lstat(full_path)
                  mode = stat.S_IMODE(st.st_mode)
                  uid = st.st_uid
                  gid = st.st_gid
                  try:
                      raw_ctx = os.getxattr(full_path, b"security.selinux", follow_symlinks=False)
                      ctx = raw_ctx.decode("utf-8", errors="ignore").rstrip("\x00\n ")
                  except Exception:
                      ctx = "u:object_r:system_file:s0"

                  if rel_path == ".":
                      fs_config_lines.append(f"/ {uid} {gid} {mode:04o}\n")
                      fc_lines.append(f"/ {ctx}\n")
                  else:
                      clean_rel = rel_path.lstrip("./")
                      fs_config_lines.append(f"{clean_rel} {uid} {gid} {mode:04o}\n")
                      escaped_path = "/" + re.escape(clean_rel)
                      fc_lines.append(f"{escaped_path} {ctx}\n")

          with open("exact_fs_config", "w") as f:
              f.writelines(fs_config_lines)
          with open("exact_file_contexts", "w") as f:
              f.writelines(fc_lines)
          print(f"Captured {len(fc_lines)} exact Android SELinux contexts and UID/GID entries.")
          EOF

          echo "=== Compiling Kernel 5.15 Compatible EROFS Image ==="
          sudo mkfs.erofs \
            -zlz4hc,9 \
            -C4096 \
            -Elegacy-compress \
            -T 1230768000 \
            --mount-point=/ \
            --fs-config-file=exact_fs_config \
            --file-contexts=exact_file_contexts \
            output/system.img \
            mnt_gsi

          sudo umount mnt_gsi
          rm -f ext4.img exact_fs_config exact_file_contexts
          sudo chown -R $USER:$USER output/
          ls -lh output/system.img

      - name: Ultra-Compress for Small Wi-Fi Download
        run: |
          cd output
          # Uses extreme dictionary compression across all CPU cores to shrink download size to ~750-850MB
          xz -9e -T0 system.img
          ls -lh system.img.xz

      - name: Upload Ready-to-Flash EROFS GSI
        uses: actions/upload-artifact@v4
        with:
          name: crDroid-12-RealmeNote50-EROFS
          path: output/system.img.xz
          compression-level: 0
