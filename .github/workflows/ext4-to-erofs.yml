name: RMX3834 GSI compatibility report (report only)

on:
  workflow_dispatch:
    inputs:
      gsi_url:
        description: "Direct link to the GSI image/archive (.img, .img.xz, .zip, .7z, .gz)"
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  DEVICE_TAG: device-Realme-Note-50
  WORK: /work

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free disk and install tools
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 erofs-utils e2fsprogs \
            rsync attr xz-utils p7zip-full unzip file python3 xxd
          sudo mkdir -p "$WORK"/{dl,vendor,src,out,mnt_v,mnt_s,mnt_o}
          sudo chown -R "$USER" "$WORK"
          mkfs.erofs --version || true
          cat > "$WORK/unsparse.py" <<'PYU'
          import struct, sys
          src, dst = sys.argv[1], sys.argv[2]
          with open(src, "rb") as f, open(dst, "wb") as o:
              magic, major, minor, fhs, chs, blk, tblks, tchunks, crc = struct.unpack("<IHHHHIIII", f.read(28))
              assert magic == 0xED26FF3A, "not a sparse image"
              f.seek(fhs)
              for _ in range(tchunks):
                  ctype, _r, csz, tsz = struct.unpack("<HHII", f.read(12))
                  n = csz * blk
                  if ctype == 0xCAC1:
                      left = n
                      while left:
                          b = f.read(min(left, 1 << 24)); o.write(b); left -= len(b)
                  elif ctype == 0xCAC2:
                      pat = f.read(4) * (blk // 4)
                      for _ in range(csz):
                          o.write(pat)
                  elif ctype == 0xCAC3:
                      o.seek(n, 1)
                  elif ctype == 0xCAC4:
                      f.read(4)
                  else:
                      raise SystemExit("unknown chunk type %x" % ctype)
              o.truncate(tblks * blk)
          PYU
          cat > "$WORK/lib.sh" <<'LIB'
          unsparse() { # in out
            if [ "$(head -c4 "$1" | xxd -p)" = "3aff26ed" ]; then python3 "$WORK/unsparse.py" "$1" "$2"; rm -f "$1"; else mv -f "$1" "$2"; fi
          }
          fstype() {
            if [ "$(dd if="$1" bs=1 skip=1024 count=4 2>/dev/null | xxd -p)" = "e2e1f5e0" ]; then echo erofs
            elif [ "$(dd if="$1" bs=1 skip=1080 count=2 2>/dev/null | xxd -p)" = "53ef" ]; then echo ext4
            else echo unknown; fi
          }
          mount_img() { # img dir
            local t; t="$(fstype "$1")"
            case "$t" in
              erofs) sudo mount -t erofs -o ro,loop "$1" "$2" ;;
              ext4)  sudo mount -t ext4 -o ro,loop,noload "$1" "$2" ;;
              *) echo "Unknown filesystem in $1"; return 1 ;;
            esac
          }
          LIB

      # ---------- 1. Inspect stock RMX3834 reference images ----------
      - name: Inspect stock firmware reference images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source "$WORK/lib.sh"
          REF="$WORK/ref"
          REPORT="$WORK/out/stock-compatibility-report.txt"
          mkdir -p "$REF" "$WORK/out"
          : > "$REPORT"
          gh release download "$DEVICE_TAG" --repo "$GITHUB_REPOSITORY" \
            -p 'vendor.img' -p 'product.img' -p 'system_ext.img' -p 'odm.img' \
            -p 'vendor_dlkm.img' -p 'boot.img' -p 'vendor_boot.img' -p 'dtbo.img' \
            -D "$REF"

          {
            echo "RMX3834 stock firmware reference inspection"
            echo "Expected firmware: RMX3834export_15_H.07"
            echo "Mode: READ-ONLY inspection; no images are modified or flashed."
            echo "Expected vendor fingerprint: realme/RMX3834/RE5C9F:15/AP3A.240905.015.A2/T.R4T2.1784276895:user/release-keys"
            echo "Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
          } >> "$REPORT"

          # Inspect filesystem partitions. Boot-chain images are recorded separately below.
          for part in vendor product system_ext odm vendor_dlkm; do
            IMG="$REF/$part.img"
            if [ ! -f "$IMG" ]; then
              if [ "$part" = "vendor_dlkm" ]; then
                echo "===== vendor_dlkm.img =====" >> "$REPORT"
                echo "Optional asset absent from release; skipped." >> "$REPORT"
                continue
              fi
              echo "::error::Missing required release asset: $part.img"; exit 1
            fi
            echo "===== $part.img =====" | tee -a "$REPORT"
            echo "Original SHA256: $(sha256sum "$IMG" | cut -d' ' -f1)" >> "$REPORT"
            echo "Original size: $(du -h "$IMG" | cut -f1)" >> "$REPORT"
            RAW="$REF/$part.raw"
            unsparse "$IMG" "$RAW"
            TYPE="$(fstype "$RAW")"
            echo "Filesystem: $TYPE" | tee -a "$REPORT"
            if [ "$TYPE" = "unknown" ]; then
              if [ "$part" = "vendor_dlkm" ]; then
                echo "vendor_dlkm filesystem not recognized; retained as reference only." >> "$REPORT"
                rm -f "$RAW"
                echo >> "$REPORT"
                continue
              fi
              echo "::error::Cannot inspect $part.img: unsupported filesystem"; exit 1
            fi
            MNT="$WORK/mnt_ref"
            sudo mkdir -p "$MNT"
            mount_img "$RAW" "$MNT"
            echo "Property files:" >> "$REPORT"
            mapfile -t PROP_FILES < <(find "$MNT" -type f -name '*.prop' -print 2>/dev/null | sort)
            if [ "${#PROP_FILES[@]}" -eq 0 ]; then
              echo "No .prop files found in this partition." >> "$REPORT"
            else
              printf '%s\n' "${PROP_FILES[@]}" | sed "s#^$MNT/##" >> "$REPORT"
              echo "Selected properties (source file shown):" >> "$REPORT"
              for pf in "${PROP_FILES[@]}"; do
                grep -H -E '^(ro\.(build\.(fingerprint|version\.release|version\.sdk)|vendor\.build\.fingerprint|vndk\.version|product\.vndk\.version|product\.first_api_level)|ro\.vendor\.(build\.fingerprint|vndk\.version))=' "$pf" 2>/dev/null || true
              done | tee -a "$REPORT"
            fi
            echo "VINTF manifests and compatibility matrices:" >> "$REPORT"
            find "$MNT/etc/vintf" -type f \
              \( -name '*manifest*.xml' -o -name '*matrix*.xml' \) -print 2>/dev/null \
              | sed "s#^$MNT/##" | sort | tee -a "$REPORT" || true
            echo "Relevant configuration paths:" >> "$REPORT"
            find "$MNT/etc" -maxdepth 3 -type f \
              \( -iname '*ims*' -o -iname '*carrier*' -o -iname '*telephony*' -o -iname '*bluetooth*' -o -iname '*wifi*' -o -iname '*audio*' -o -iname '*camera*' -o -iname '*fingerprint*' -o -iname '*permissions*.xml' \) \
              -print 2>/dev/null | sed "s#^$MNT/##" | sort | head -250 | tee -a "$REPORT" || true
            if [ "$part" = "vendor" ]; then
              VNDK="$(grep -h -E '^(ro\.vndk\.version|ro\.vendor\.vndk\.version)=' "${PROP_FILES[@]}" 2>/dev/null | head -1 | cut -d= -f2- || true)"
              VFP="$(grep -h '^ro\.vendor\.build\.fingerprint=' "${PROP_FILES[@]}" 2>/dev/null | head -1 | cut -d= -f2- || true)"
              echo "Vendor VNDK found in image: ${VNDK:-NOT FOUND}" | tee -a "$REPORT"
              echo "Vendor fingerprint found in image: ${VFP:-NOT FOUND}" | tee -a "$REPORT"
              if [ -n "$VNDK" ] && [ "$VNDK" != "33" ]; then
                echo "WARNING: vendor image property reports VNDK $VNDK; probe previously reported 33." | tee -a "$REPORT"
              elif [ -z "$VNDK" ]; then
                echo "NOTE: VNDK property not found in scanned vendor .prop files; this alone does not prove incompatibility." | tee -a "$REPORT"
              fi
              EXPECTED_FP="realme/RMX3834/RE5C9F:15/AP3A.240905.015.A2/T.R4T2.1784276895:user/release-keys"
              if [ -n "$VFP" ] && [ "$VFP" != "$EXPECTED_FP" ]; then
                echo "WARNING: vendor image fingerprint differs from expected firmware fingerprint." | tee -a "$REPORT"
              elif [ -z "$VFP" ]; then
                echo "NOTE: vendor fingerprint not found in scanned .prop files." | tee -a "$REPORT"
              fi
            fi
            if [ "$part" = "vendor_dlkm" ]; then
              echo "Kernel modules:" >> "$REPORT"
              find "$MNT" -type f -name '*.ko' -print 2>/dev/null \
                | sed "s#^$MNT/##" | sort | head -300 | tee -a "$REPORT" || true
            fi
            sudo umount "$MNT"
            rm -f "$RAW"
            echo >> "$REPORT"
          done

          # Record boot-chain images without modifying or flashing them.
          for part in boot vendor_boot dtbo; do
            IMG="$REF/$part.img"
            [ -f "$IMG" ] || { echo "::error::Missing required release asset: $part.img"; exit 1; }
            {
              echo "===== $part.img (reference only) ====="
              file "$IMG"
              stat -c 'Size: %s bytes' "$IMG"
              sha256sum "$IMG"
              echo
            } >> "$REPORT"
          done
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          # Do not retain multi-GB stock images on the runner after inspection.
          rm -rf "$REF"
      - name: Download and inspect GSI (read-only)
        env:
          GSI_URL: ${{ inputs.gsi_url }}
        run: |
          set -euo pipefail
          source "$WORK/lib.sh"
          mkdir -p "$WORK/gsi" "$WORK/mnt_gsi"
          cd "$WORK/gsi"
          aria2c -x8 -s8 -k1M --allow-overwrite=true -o input "$GSI_URL"
          mkdir extracted
          KIND="$(file -b input)"
          case "$KIND" in
            *Zip*) unzip -oq input -d extracted ;;
            XZ*) xz -dc input > extracted/system.img ;;
            gzip*) gzip -dc input > extracted/system.img ;;
            *7-zip*) 7z x -y -oextracted input >/dev/null ;;
            *) cp input extracted/system.img ;;
          esac
          find extracted -type f \( -name '*.xz' -o -name '*.gz' \) -print0 | while IFS= read -r -d '' f; do
            case "$f" in
              *.xz) xz -dk "$f" ;;
              *.gz) gzip -dk "$f" ;;
            esac
          done
          IMG="$(find extracted -type f -iname '*.img' -printf '%s %p\n' | sort -rn | head -1 | cut -d' ' -f2-)"
          [ -n "$IMG" ] || { echo 'No .img found in GSI archive' >&2; exit 1; }
          unsparse "$IMG" "$WORK/gsi/system.raw"
          TYPE="$(fstype "$WORK/gsi/system.raw")"
          echo "GSI image: $IMG" >> "$WORK/out/stock-compatibility-report.txt"
          echo "GSI filesystem: $TYPE" >> "$WORK/out/stock-compatibility-report.txt"
          mount_img "$WORK/gsi/system.raw" "$WORK/mnt_gsi"
          M="$WORK/mnt_gsi"
          {
            echo
            echo '===== GSI system image (read-only inspection) ====='
            echo 'Property files and selected properties:'
            mapfile -t GSI_PROPS < <(find "$M" -type f -name '*.prop' -print 2>/dev/null | sort)
            if [ "${#GSI_PROPS[@]}" -gt 0 ]; then
              printf '%s\\n' "${GSI_PROPS[@]}" | sed "s#^$M/##"
              for pf in "${GSI_PROPS[@]}"; do
                grep -H -E '^(ro\\.(build\\.(fingerprint|version\\.release|version\\.sdk)|product\\.|system\\.|vendor\\.)|ro\\.vndk)' "$pf" 2>/dev/null || true
              done
            else
              echo 'No .prop files found in GSI image.'
            fi
            echo
            echo 'VINTF files:'
            find "$M" -type f -path '*/etc/vintf/*' \( -name '*.xml' -o -name '*.json' \) -printf '%P\n' 2>/dev/null | sort | head -400 || true
            echo
            echo 'Overlay directories / overlay APKs:'
            find "$M" \( -type d -iname '*overlay*' -o -type f -iname '*overlay*.apk' \) -printf '%P\n' 2>/dev/null | sort | head -400 || true
            echo
            echo 'Permission and feature XML files:'
            find "$M" -type f \( -path '*/etc/permissions/*.xml' -o -path '*/etc/sysconfig/*.xml' \) -printf '%P\n' 2>/dev/null | sort | head -600 || true
            echo
            echo 'Init rc files:'
            find "$M" -type f -name '*.rc' -printf '%P\n' 2>/dev/null | sort | head -500 || true
            echo
            echo 'Radio / IMS / Bluetooth / Wi-Fi / camera / audio related paths:'
            find "$M" -type f \( -iname '*ims*' -o -iname '*radio*' -o -iname '*ril*' -o -iname '*bluetooth*' -o -iname '*wifi*' -o -iname '*camera*' -o -iname '*audio*' -o -iname '*gnss*' -o -iname '*fingerprint*' \) -printf '%P\n' 2>/dev/null | sort | head -800 || true
            echo
            echo '===== End GSI inspection ====='
          } >> "$WORK/out/stock-compatibility-report.txt"
          sudo umount "$M"
          rm -rf "$WORK/gsi" "$WORK/mnt_gsi"

      - name: Upload report only
        uses: actions/upload-artifact@v4
        with:
          name: rmx3834-compatibility-report
          path: /work/out/stock-compatibility-report.txt
          if-no-files-found: error
          retention-days: 14
