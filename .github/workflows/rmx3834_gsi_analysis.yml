name: Build Realme Note 50 (RMX3834) crDroid 12.12 Customized Image

on:
  workflow_dispatch:
    inputs:
      gsi_url:
        description: "Direct URL to crDroid GSI (.img.xz or .img)"
        required: true
        default: "https://github.com/Doze-off/crdroid_gsi_treble/releases/download/2026-09-22/crDroid-12.12-GSI_treble_arm64-ab-GAPPS-20260922.img.xz"
        type: string
      device_name:
        description: "Device model identifier"
        required: true
        default: "Realme Note 50"
        type: string
      clean_foreign_overlays:
        description: "Remove conflicting OEM overlays (Samsung, Moto, etc.)"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  DEVICE_TAG: device-Realme-Note-50
  WORK: /work

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Free Disk Space and Install Build Toolchain
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 erofs-utils e2fsprogs rsync attr xz-utils \
            p7zip-full unzip file python3 python3-pip xxd aapt zipalign openjdk-17-jdk-headless
          sudo mkdir -p "$WORK"/{ref,gsi,mnt_ref,mnt_gsi,out,build,tools}
          sudo chown -R "$USER":"$USER" "$WORK"

          # Python unsparse utility
          cat > "$WORK/tools/unsparse.py" <<'PYU'
          import struct, sys
          src, dst = sys.argv[1], sys.argv[2]
          with open(src, "rb") as f, open(dst, "wb") as o:
              magic, major, minor, fhs, chs, blk, tblks, tchunks, crc = struct.unpack("<IHHHHIIII", f.read(28))
              if magic != 0xED26FF3A:
                  sys.exit(1)
              f.seek(fhs)
              for _ in range(tchunks):
                  ctype, _r, csz, tsz = struct.unpack("<HHII", f.read(12))
                  n = csz * blk
                  if ctype == 0xCAC1:
                      left = n
                      while left:
                          b = f.read(min(left, 1 << 24)); o.write(b); left -= len(b)
                  elif ctype == 0xCAC2:
                      pat = f.read(4) * (blk // 4)
                      for _ in range(csz):
                          o.write(pat)
                  elif ctype == 0xCAC3:
                      o.seek(n, 1)
                  elif ctype == 0xCAC4:
                      f.read(4)
                  else:
                      sys.exit(f"Unknown chunk type {ctype:x}")
              o.truncate(tblks * blk)
          PYU

          cat > "$WORK/tools/lib.sh" <<'LIB'
          unsparse_img() {
            if [ "$(head -c4 "$1" | xxd -p)" = "3aff26ed" ]; then
              python3 "$WORK/tools/unsparse.py" "$1" "$2"
              rm -f "$1"
            else
              mv -f "$1" "$2"
            fi
          }
          fstype() {
            if [ "$(dd if="$1" bs=1 skip=1024 count=4 2>/dev/null | xxd -p)" = "e2e1f5e0" ]; then echo erofs
            elif [ "$(dd if="$1" bs=1 skip=1080 count=2 2>/dev/null | xxd -p)" = "53ef" ]; then echo ext4
            else echo unknown; fi
          }
          LIB

      - name: Fetch Stock Reference Partitions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source "$WORK/tools/lib.sh"
          echo "[+] Downloading stock partitions from release $DEVICE_TAG..."
          gh release download "$DEVICE_TAG" --repo "$GITHUB_REPOSITORY" \
            -p 'vendor.img' -p 'product.img' -p 'system_ext.img' -p 'odm.img' \
            -D "$WORK/ref"

          for part in vendor product system_ext odm; do
            echo "[+] Preparing $part partition..."
            unsparse_img "$WORK/ref/$part.img" "$WORK/ref/$part.raw"
            sudo mkdir -p "$WORK/mnt_ref/$part"
            sudo mount -t erofs -o ro,loop "$WORK/ref/$part.raw" "$WORK/mnt_ref/$part"
          done

      - name: Fetch Target crDroid 12.12 GSI
        env:
          GSI_URL: ${{ inputs.gsi_url }}
        run: |
          source "$WORK/tools/lib.sh"
          cd "$WORK/gsi"
          echo "[+] Downloading GSI..."
          aria2c -x8 -s8 -k1M --allow-overwrite=true -o gsi_dl "$GSI_URL"
          KIND="$(file -b gsi_dl)"
          case "$KIND" in
            *Zip*) unzip -oq gsi_dl ;;
            XZ*) xz -dc gsi_dl > system.img ;;
            gzip*) gzip -dc gsi_dl > system.img ;;
            *7-zip*) 7z x -y gsi_dl >/dev/null ;;
            *) cp gsi_dl system.img ;;
          esac
          find . -maxdepth 2 -type f \( -name '*.xz' -o -name '*.gz' \) -exec xz -dk {} + 2>/dev/null || true
          RAW_GSI="$(find . -type f -iname '*.img' -printf '%s %p\n' | sort -rn | head -1 | cut -d' ' -f2-)"
          unsparse_img "$RAW_GSI" "$WORK/build/system.raw"

          # Enlarge the ext4 image by 512MB to safely accommodate new RROs and device configurations
          echo "[+] Resizing raw system image for modifications..."
          e2fsck -fy "$WORK/build/system.raw" || true
          resize2fs "$WORK/build/system.raw" 4200M

          sudo mkdir -p "$WORK/mnt_gsi"
          sudo mount -t ext4 -o loop,rw "$WORK/build/system.raw" "$WORK/mnt_gsi"

      - name: Build Device-Specific RRO (Brightness & Display Overlay)
        run: |
          echo "[+] Generating RMX3834 specific display and brightness overlay..."
          RRO_DIR="$WORK/tools/overlay_build"
          mkdir -p "$RRO_DIR"/{res/values,res/xml}

          cat > "$RRO_DIR/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="me.phh.treble.overlay.realme.rmx3834"
              android:versionCode="1"
              android:versionName="1.0">
              <overlay android:targetPackage="android"
                       android:priority="1000"
                       android:isStatic="true"/>
          </manifest>
          EOF

          # Compile exact lux-to-nit curves, 4095 backlight step boundaries, and debounce timings from stock dump
          cat > "$RRO_DIR/res/values/config.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <!-- Unisoc T612 sprd_backlight range: 0-4095 -->
              <integer name="config_screenBrightnessSettingMinimum">1</integer>
              <integer name="config_screenBrightnessSettingMaximum">4095</integer>
              <integer name="config_screenBrightnessSettingDefault">1024</integer>
              <integer name="config_screenBrightnessDoze">17</integer>

              <!-- Stock light sensor debounce timings -->
              <integer name="config_autoBrightnessBrighteningLightDebounce">2000</integer>
              <integer name="config_autoBrightnessDarkeningLightDebounce">4000</integer>

              <!-- Backlight curve mapping arrays -->
              <integer-array name="config_autoBrightnessLevels">
                  <item>16</item>
                  <item>32</item>
                  <item>50</item>
                  <item>100</item>
                  <item>140</item>
                  <item>180</item>
                  <item>240</item>
                  <item>300</item>
                  <item>600</item>
                  <item>800</item>
                  <item>1000</item>
                  <item>2000</item>
                  <item>3000</item>
                  <item>4000</item>
                  <item>5000</item>
                  <item>6000</item>
                  <item>8000</item>
                  <item>10000</item>
              </integer-array>

              <array name="config_autoBrightnessDisplayValuesNits">
                  <item>33.07</item>
                  <item>49.81</item>
                  <item>65.02</item>
                  <item>80.20</item>
                  <item>96.75</item>
                  <item>111.80</item>
                  <item>144.30</item>
                  <item>144.30</item>
                  <item>144.30</item>
                  <item>144.30</item>
                  <item>144.30</item>
                  <item>260.00</item>
                  <item>288.50</item>
                  <item>302.00</item>
                  <item>308.70</item>
                  <item>315.40</item>
                  <item>330.00</item>
                  <item>363.60</item>
                  <item>366.60</item>
              </array>

              <!-- 90Hz Display Refresh Rate Defaults -->
              <integer name="config_defaultRefreshRate">0</integer>
              <integer name="config_defaultPeakRefreshRate">90</integer>
          </resources>
          EOF

          # Compile and package APK using aapt
          AAPT_PLATFORM="$WORK/tools/android.jar"
          # Fetch lightweight android stub jar for resource compilation
          curl -sLo "$AAPT_PLATFORM" "https://raw.githubusercontent.com/iBotPeaches/Apktool/master/brut.apktool/apktool-lib/src/main/resources/prebuilt/android-34.jar"

          aapt package -f -M "$RRO_DIR/AndroidManifest.xml" -S "$RRO_DIR/res" -I "$AAPT_PLATFORM" -F "$WORK/tools/treble-overlay-realme-rmx3834-unsigned.apk"
          
          # Align APK
          zipalign -p -f 4 "$WORK/tools/treble-overlay-realme-rmx3834-unsigned.apk" "$WORK/tools/treble-overlay-realme-rmx3834.apk"

          # Install into GSI product overlay directory
          sudo mkdir -p "$WORK/mnt_gsi/system/product/overlay"
          sudo cp "$WORK/tools/treble-overlay-realme-rmx3834.apk" "$WORK/mnt_gsi/system/product/overlay/"
          sudo chmod 644 "$WORK/mnt_gsi/system/product/overlay/treble-overlay-realme-rmx3834.apk"
          sudo chown root:root "$WORK/mnt_gsi/system/product/overlay/treble-overlay-realme-rmx3834.apk"

      - name: Apply Subsystem & Hardware Adaptation Patches
        env:
          CLEAN_FOREIGN: ${{ inputs.clean_foreign_overlays }}
          DEV_NAME: ${{ inputs.device_name }}
        run: |
          set -e
          GSI="$WORK/mnt_gsi"

          echo "[+] Applying Device Identity and Platform Branding..."
          cat <<EOF | sudo tee -a "$GSI/system/build.prop" > /dev/null

          # ==============================================================
          # Realme Note 50 (RMX3834) Hardware & Subsystem Adaptation
          # ==============================================================
          ro.product.model=RMX3834
          ro.product.name=RMX3834
          ro.product.device=RMX3834
          ro.product.brand=realme
          ro.product.manufacturer=realme
          ro.build.product=RMX3834
          ro.soc.model=UMS9230
          ro.board.platform=ums9230_hulk

          # Stock Reference Identity
          ro.vendor.build.fingerprint=realme/RMX3834/RE5C9F:15/AP3A.240905.015.A2/T.R4T2.1784276895:user/release-keys

          # --- Bluetooth & Audio Offload Corrections ---
          # Unisoc T612 Bluetooth does not support DSP A2DP hardware offloading
          persist.bluetooth.a2dp_offload.disabled=true
          ro.bluetooth.a2dp_offload.supported=false
          persist.vendor.bt.a2dp_offload_cap=false
          bluetooth.profile.a2dp.source.enabled=true
          bluetooth.profile.hfp.ag.enabled=true
          bluetooth.profile.hid.host.enabled=true
          bluetooth.profile.pan.nap.enabled=true

          # --- Display and Backlight Scale ---
          vendor.thermal.maxbrightness=4095
          persist.vendor.brightness.doze=true
          ro.surface_flinger.has_wide_color_display=false
          ro.surface_flinger.has_HDR_display=false

          # --- Audio HAL Compatibility (Whale HAL) ---
          ro.hardware.audio.primary=ums9230
          ro.vendor.audio.whale_hal=true
          ro.vendor.mmi.use.audio.whale.hal=1

          # --- Unisoc Radio & IMS Plumbing ---
          persist.vendor.radio.tele.optimization=true
          persist.vendor.sys.single.imsstack=true
          persist.vendor.sys.volte.enable=true
          persist.radio.multisim.config=dsds
          persist.vendor.radio.modem.capability=TL_LF_W_G,TL_LF_W_G
          EOF

          echo "[+] Applying identical configurations to product build.prop..."
          if [ -f "$GSI/system/product/etc/build.prop" ]; then
            cat <<EOF | sudo tee -a "$GSI/system/product/etc/build.prop" > /dev/null

            # Realme Note 50 Overrides
            ro.product.product.model=RMX3834
            ro.product.product.name=RMX3834
            ro.product.product.brand=realme
            persist.bluetooth.a2dp_offload.disabled=true
            ro.bluetooth.a2dp_offload.supported=false
            EOF
          fi

          if [ "$CLEAN_FOREIGN" = "true" ]; then
            echo "[+] Auditing and pruning conflicting foreign OEM overlays..."
            # Strip non-Realme/Unisoc device-specific treble overlays
            for o in "$GSI/system/product/overlay"/treble-overlay-*.apk; do
              case "$(basename "$o")" in
                treble-overlay-realme*|treble-overlay-sprd*|treble-overlay-telephony-sprd*|treble-overlay-wifi*|treble-overlay-NavBar.apk|treble-overlay-NightMode.apk)
                  # Preserve generic and Unisoc overlays
                  ;;
                *)
                  sudo rm -f "$o"
                  ;;
              esac
            done
          fi

          # Ensure SELinux permissions are clean on modified files
          sudo chcon -R u:object_r:system_file:s0 "$GSI/system/build.prop" 2>/dev/null || true
          if [ -d "$GSI/system/product/overlay" ]; then
            sudo chcon -R u:object_r:system_file:s0 "$GSI/system/product/overlay" 2>/dev/null || true
          fi

      - name: Safely Unmount and Shrink Output Image
        run: |
          echo "[+] Unmounting partitions..."
          sudo umount "$WORK/mnt_gsi"
          for part in vendor product system_ext odm; do
            sudo umount "$WORK/mnt_ref/$part" 2>/dev/null || true
          done

          echo "[+] Running filesystem check on customized system image..."
          e2fsck -fy "$WORK/build/system.raw" || true

          echo "[+] Minimizing ext4 filesystem footprint..."
          resize2fs -M "$WORK/build/system.raw"

          FINAL_IMG="$WORK/out/crDroid-12.12-RMX3834-Customized.img"
          mv "$WORK/build/system.raw" "$FINAL_IMG"

          echo "[+] Compressing final system image with xz (multi-threaded)..."
          xz -T0 -9 -c "$FINAL_IMG" > "$FINAL_IMG.xz"
          sha256sum "$FINAL_IMG.xz" > "$FINAL_IMG.xz.sha256"

      - name: Upload Customized Realme Note 50 System Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crDroid-12.12-Realme-Note-50-RMX3834
          path: |
            /work/out/*.img.xz
            /work/out/*.sha256
          if-no-files-found: error
          retention-days: 14
